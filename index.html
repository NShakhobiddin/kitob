<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f8">
<title>Kitob Mag'zi</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --fon: #eef1f8;
    --karta: #ffffff;
    --asos: #1e3a8a;
    --asos-tim: #152a63;
    --asos-yorug: #2c4fb0;
    --asos-och: #e7ecfb;
    --asos-och-2: #f2f5fd;
    --matn: #16204a;
    --matn-xira: #7b86a8;
    --chegara: #e4e9f6;
    --soya: 0 6px 22px rgba(30, 58, 138, .07);
    --soya-past: 0 2px 10px rgba(30, 58, 138, .05);
    --sans: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--fon); }

  body {
    font-family: var(--sans);
    color: var(--matn);
    font-size: 15px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* Fondagi yumshoq ko'k shakllar — rasmsiz, faqat CSS */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(58% 38% at 88% 4%, rgba(30, 58, 138, .12), transparent 70%),
      radial-gradient(46% 30% at 4% 96%, rgba(30, 58, 138, .08), transparent 70%);
  }

  #ildiz { position: relative; z-index: 1; }

  .qobiq {
    max-width: 620px;
    margin: 0 auto;
    padding: 14px 16px calc(96px + env(safe-area-inset-bottom));
  }

  h1, h2, h3, h4 { font-weight: 600; margin: 0; line-height: 1.3; letter-spacing: -.01em; }

  /* ---------- Yuqori panel ---------- */
  .panel {
    display: flex; align-items: center; gap: 12px;
    padding: 6px 0 16px;
  }
  .panel h2 { flex: 1; text-align: center; font-size: 17px; }
  .dumaloq-tug {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 13px;
    display: grid; place-items: center; cursor: pointer;
    background: var(--karta); border: 1px solid var(--chegara);
    color: var(--asos); box-shadow: var(--soya-past);
    font-size: 16px; font-family: var(--sans); position: relative;
    transition: transform .14s ease, background .18s;
  }
  .dumaloq-tug:active { transform: scale(.93); }
  .dumaloq-tug .nuqta {
    position: absolute; top: 7px; right: 7px;
    min-width: 15px; height: 15px; padding: 0 4px; border-radius: 999px;
    background: #e0364f; color: #fff; font-size: 9.5px; font-weight: 600;
    display: grid; place-items: center; line-height: 1;
  }

  /* ---------- Salom bloki ---------- */
  .salom h1 { font-size: 26px; font-weight: 700; color: var(--asos); }
  .salom p { margin: 2px 0 0; color: var(--matn-xira); font-size: 14px; }

  .qidiruv {
    display: flex; align-items: center; gap: 10px;
    background: var(--karta); border: 1px solid var(--chegara);
    border-radius: 999px; padding: 12px 18px; margin: 18px 0;
    box-shadow: var(--soya-past);
  }
  .qidiruv svg { flex: 0 0 auto; color: var(--matn-xira); }
  .qidiruv input {
    flex: 1; min-width: 0; border: 0; background: none; outline: none;
    font-family: var(--sans); font-size: 14.5px; color: var(--matn);
  }
  .qidiruv input::placeholder { color: var(--matn-xira); }
  .qidiruv button {
    background: none; border: 0; color: var(--matn-xira);
    font-size: 18px; cursor: pointer; padding: 0; line-height: 1;
  }

  /* ---------- Xush kelibsiz banneri ---------- */
  .banner {
    display: flex; align-items: center; gap: 12px;
    background: var(--karta); border: 1.5px solid var(--asos-och);
    border-radius: 20px; padding: 16px 18px; box-shadow: var(--soya);
  }
  .banner-matn { flex: 1; min-width: 0; }
  .banner-matn h3 { font-size: 16px; font-weight: 600; color: var(--asos); margin-bottom: 3px; }
  .banner-matn p { margin: 0; font-size: 13.5px; color: var(--matn-xira); line-height: 1.45; }
  .banner-rasm {
    flex: 0 0 auto; width: 74px; height: 62px;
    display: grid; place-items: center;
    background: var(--asos-och); border-radius: 16px; color: var(--asos);
  }

  /* ---------- Bo'lim sarlavhasi (ro'yxatlar uchun) ---------- */
  .satr-bosh {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 26px 0 12px;
  }
  .satr-bosh h3 { font-size: 17px; font-weight: 600; }
  .satr-bosh span { font-size: 13px; color: var(--matn-xira); }

  /* ---------- Kitob kartalari (2 ustunli) ---------- */
  .kartalar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .kitob-karta {
    display: flex; flex-direction: column; align-items: stretch;
    background: var(--asos-och-2); border: 1px solid var(--chegara);
    border-radius: 20px; padding: 14px; cursor: pointer;
    text-align: left; width: 100%; color: inherit; font: inherit;
    box-shadow: var(--soya-past);
    transition: transform .16s ease, box-shadow .18s ease;
  }
  .kitob-karta:active { transform: scale(.975); }
  .kitob-karta:hover { box-shadow: var(--soya); }

  .kitob-karta.faol {
    background: linear-gradient(158deg, var(--asos-yorug), var(--asos-tim));
    border-color: transparent;
    box-shadow: 0 10px 26px rgba(21, 42, 99, .28);
    color: #fff;
  }

  .karta-yuqori { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .karta-sana { font-size: 11px; color: var(--matn-xira); }
  .kitob-karta.faol .karta-sana { color: rgba(255,255,255,.7); }
  .karta-nuqta { color: var(--matn-xira); font-size: 15px; line-height: 1; }
  .kitob-karta.faol .karta-nuqta { color: rgba(255,255,255,.7); }

  .muqova {
    flex: 0 0 auto; width: 36px; height: 36px; border-radius: 11px;
    display: grid; place-items: center; color: #fff; font-size: 15px;
    box-shadow: 0 4px 12px rgba(21, 42, 99, .18);
  }

  .kitob-matn { min-width: 0; flex: 1; }
  .kitob-matn h3 {
    font-size: 14.5px; font-weight: 600; margin-bottom: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .kitob-matn .muallif {
    font-size: 11.5px; color: var(--matn-xira);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kitob-karta.faol .kitob-matn .muallif { color: rgba(255,255,255,.72); }
  .kitob-matn .tavsif {
    font-size: 12px; color: var(--matn-xira); margin-top: 6px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .kitob-karta.faol .kitob-matn .tavsif { color: rgba(255,255,255,.75); }

  .karta-jarayon { margin-top: 14px; }
  .karta-jarayon .yorliq { font-size: 11px; color: var(--matn-xira); margin-bottom: 6px; }
  .kitob-karta.faol .karta-jarayon .yorliq { color: rgba(255,255,255,.75); }
  .karta-jarayon .qator { display: flex; align-items: center; gap: 8px; }
  .karta-jarayon .foiz { font-size: 11px; color: var(--matn-xira); font-weight: 500; }
  .kitob-karta.faol .karta-jarayon .foiz { color: #fff; }

  .progress-chiziq {
    flex: 1; height: 5px; border-radius: 999px; background: rgba(30, 58, 138, .12);
    overflow: hidden;
  }
  .kitob-karta.faol .progress-chiziq { background: rgba(255,255,255,.22); }
  .progress-chiziq i {
    display: block; height: 100%; border-radius: 999px;
    background: var(--asos); transition: width .35s ease;
  }
  .kitob-karta.faol .progress-chiziq i { background: #fff; }

  /* ---------- Turkum kartasi ---------- */
  .turkum-karta {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: var(--karta); border: 1px solid var(--chegara);
    border-radius: 20px; padding: 15px 16px; margin-bottom: 12px;
    box-shadow: var(--soya); cursor: pointer;
    font: inherit; color: inherit; text-align: left;
    transition: transform .16s ease, box-shadow .18s ease;
  }
  .turkum-karta:active { transform: scale(.985); }
  .turkum-karta.faol { border-color: var(--asos); }

  .turkum-muqovalar { flex: 0 0 auto; display: flex; }
  .turkum-muqovalar span {
    width: 38px; height: 50px; border-radius: 10px;
    display: grid; place-items: center; color: #fff; font-size: 13px;
    border: 2px solid var(--karta);
    box-shadow: 0 3px 10px rgba(21, 42, 99, .18);
  }
  .turkum-muqovalar span + span { margin-left: -20px; }

  .turkum-matn { flex: 1; min-width: 0; }
  .turkum-matn h3 { font-size: 15.5px; font-weight: 600; margin-bottom: 2px; }
  .turkum-matn .muallif { font-size: 12px; color: var(--matn-xira); }
  .turkum-matn .karta-jarayon { margin-top: 10px; }
  .turkum-strelka { flex: 0 0 auto; color: var(--asos); opacity: .5; font-size: 20px; line-height: 1; }

  .hero .hero-muqovalar { justify-content: center; margin-bottom: 14px; }
  .hero .hero-muqovalar span {
    width: 46px; height: 62px; border-radius: 13px; font-size: 15px;
    border-color: rgba(255,255,255,.28);
  }
  .hero .hero-muqovalar span + span { margin-left: -22px; }

  .qator-karta.joriy { border-color: var(--asos); }

  /* ---------- Kitob sahifasi: navy hero ---------- */
  .hero {
    background: linear-gradient(158deg, var(--asos-yorug), var(--asos-tim));
    border-radius: 24px; padding: 22px 20px; color: #fff;
    box-shadow: 0 12px 30px rgba(21, 42, 99, .26);
    text-align: center; margin-bottom: 18px;
  }
  .hero-muqova {
    width: 74px; height: 74px; border-radius: 24px; margin: 0 auto 14px;
    display: grid; place-items: center; font-size: 28px;
    background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.22);
  }
  .hero h2 { font-size: 19px; font-weight: 600; margin-bottom: 4px; }
  .hero .muallif { font-size: 13px; color: rgba(255,255,255,.75); }
  .hero-stat {
    display: flex; margin-top: 18px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,.16);
  }
  .hero-stat div { flex: 1; }
  .hero-stat b { display: block; font-size: 20px; font-weight: 600; line-height: 1.2; }
  .hero-stat span { font-size: 11.5px; color: rgba(255,255,255,.7); }

  .kirish {
    background: var(--karta); border: 1px solid var(--chegara);
    border-radius: 18px; padding: 16px 18px; margin-bottom: 18px;
    font-size: 14px; color: var(--matn-xira); line-height: 1.6;
    box-shadow: var(--soya-past);
  }

  /* ---------- Akkordeon ---------- */
  .bolim {
    background: var(--karta); border: 1px solid var(--chegara);
    border-radius: 20px; margin-bottom: 12px; overflow: hidden;
    box-shadow: var(--soya-past);
    transition: box-shadow .2s ease;
  }
  .bolim.ochiq { box-shadow: var(--soya); }

  .bolim-tugma {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 15px 16px; background: none; border: 0; color: inherit;
    font: inherit; text-align: left; cursor: pointer;
  }
  .raqam {
    flex: 0 0 auto; width: 36px; height: 36px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--asos-och); color: var(--asos);
    font-size: 14px; font-weight: 600;
  }
  .bolim.ochiq .raqam { background: var(--asos); color: #fff; }
  .bolim-tugma h4 { flex: 1; font-size: 15px; font-weight: 600; }
  .strelka { color: var(--asos); opacity: .6; transition: transform .25s ease; font-size: 11px; }
  .bolim.ochiq .strelka { transform: rotate(180deg); }

  .bolim-tugma .kichik { font-size: 11.5px; color: var(--matn-xira); font-weight: 400; margin-top: 2px; }

  .bolim-ich { padding: 0 16px 18px; animation: ochil .28s ease; }

  /* Bo'limchalar: Mag'iz | Mashqlar */
  .bolimcha-tanlov {
    display: flex; gap: 5px; padding: 5px;
    background: var(--asos-och-2); border: 1px solid var(--chegara);
    border-radius: 14px; margin-bottom: 4px;
  }
  .bolimcha-tug {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: none; border: 0; border-radius: 10px; cursor: pointer;
    padding: 9px 6px; font-family: var(--sans); font-size: 13px; font-weight: 500;
    color: var(--matn-xira); transition: background .2s, color .2s, box-shadow .2s;
  }
  .bolimcha-tug.faol {
    background: var(--karta); color: var(--asos); font-weight: 600;
    box-shadow: var(--soya-past);
  }
  .bolimcha-tug .son {
    font-size: 10.5px; font-weight: 600; line-height: 1;
    background: var(--asos-och); color: var(--asos);
    border-radius: 999px; padding: 3px 6px;
  }
  .bolimcha-tug.faol .son { background: var(--asos); color: #fff; }
  .bolimcha-ich { animation: ochil .24s ease; }
  @keyframes ochil { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  .qism { margin-top: 18px; }
  .qism-sarlavha {
    display: flex; align-items: center; gap: 8px;
    font-size: 11.5px; letter-spacing: .09em; font-weight: 600;
    text-transform: uppercase; color: var(--asos); margin-bottom: 11px;
  }
  .qism-sarlavha::after {
    content: ""; flex: 1; height: 1px; background: var(--chegara);
  }

  ul.magiz { list-style: none; margin: 0; padding: 0; }
  ul.magiz li { position: relative; padding-left: 18px; margin-bottom: 10px; font-size: 14.5px; }
  ul.magiz li::before {
    content: ""; position: absolute; left: 0; top: 9px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--asos); opacity: .45;
  }

  ol.tavsiyalar { margin: 0; padding-left: 20px; }
  ol.tavsiyalar li { margin-bottom: 9px; font-size: 14.5px; }
  ol.tavsiyalar li::marker { color: var(--asos); font-weight: 600; }

  /* ---------- Mashqlar ---------- */
  .mashq {
    background: var(--asos-och-2); border: 1px solid var(--chegara);
    border-radius: 18px; padding: 15px; margin-bottom: 12px;
  }
  .mashq-turi {
    display: inline-block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    font-weight: 600; color: var(--asos); background: var(--asos-och);
    border-radius: 999px; padding: 4px 11px; margin-bottom: 10px;
  }
  .mashq-savol { font-size: 14.5px; margin-bottom: 12px; font-weight: 500; }

  textarea {
    width: 100%; min-height: 108px; resize: vertical;
    background: var(--karta); color: var(--matn);
    border: 1px solid var(--chegara); border-radius: 14px;
    padding: 12px 14px; font-family: var(--sans); font-size: 14.5px; line-height: 1.55;
    transition: border-color .18s, box-shadow .18s;
  }
  textarea:focus { outline: none; border-color: var(--asos); box-shadow: 0 0 0 3px rgba(30,58,138,.09); }
  textarea::placeholder { color: var(--matn-xira); }

  .holat { font-size: 11.5px; color: var(--matn-xira); margin-top: 8px; min-height: 16px; }
  .holat.saqlandi { color: var(--asos); font-weight: 500; }

  .band {
    display: flex; gap: 11px; align-items: flex-start;
    padding: 9px 0; cursor: pointer; font-size: 14.5px;
  }
  .band + .band { border-top: 1px solid var(--chegara); }
  .quti {
    flex: 0 0 auto; width: 21px; height: 21px; margin-top: 1px;
    border: 1.5px solid #cdd6ee; border-radius: 7px; background: var(--karta);
    display: grid; place-items: center; font-size: 12px; color: #fff;
    transition: all .18s ease;
  }
  .band.belgili .quti { background: var(--asos); border-color: var(--asos); }
  .band.belgili .yorliq { color: var(--matn-xira); text-decoration: line-through; }

  .mashq .progress-chiziq { margin-top: 12px; }

  input[type=range] {
    width: 100%; -webkit-appearance: none; appearance: none;
    background: transparent; margin: 6px 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 5px; border-radius: 999px; background: rgba(30,58,138,.14);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 20px; height: 20px; border-radius: 50%; margin-top: -7.5px;
    background: var(--asos); border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(30,58,138,.35);
  }
  input[type=range]::-moz-range-track { height: 5px; border-radius: 999px; background: rgba(30,58,138,.14); }
  input[type=range]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; background: var(--asos);
    box-shadow: 0 2px 8px rgba(30,58,138,.35);
  }

  .slider-qiymat {
    text-align: center; font-size: 30px; font-weight: 700; color: var(--asos);
    line-height: 1.1; margin-bottom: 4px;
  }
  .yorliqlar { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--matn-xira); }

  .taymer-orin { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .halqa { position: relative; width: 132px; height: 132px; }
  .halqa svg { transform: rotate(-90deg); display: block; }
  .halqa circle { fill: none; stroke-width: 7; stroke-linecap: round; }
  .halqa .iz { stroke: rgba(30,58,138,.11); }
  .halqa .yoy { stroke: var(--asos); transition: stroke-dashoffset 1s linear; }
  .halqa .vaqt {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 26px; font-weight: 600; color: var(--matn);
  }

  .tugmalar { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; }
  .tug {
    background: var(--karta); border: 1px solid var(--chegara);
    color: var(--asos); border-radius: 999px; padding: 9px 18px;
    font-family: var(--sans); font-size: 13.5px; font-weight: 500; cursor: pointer;
    box-shadow: var(--soya-past);
    transition: background .18s, transform .12s;
  }
  .tug:active { transform: scale(.95); }
  .tug.asosiy {
    background: var(--asos); color: #fff; border-color: var(--asos); font-weight: 600;
    box-shadow: 0 6px 16px rgba(30,58,138,.26);
  }
  .tug.jim { background: none; color: var(--matn-xira); box-shadow: none; }
  .tug:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }

  .variant {
    display: block; width: 100%; text-align: left;
    background: var(--karta); border: 1px solid var(--chegara);
    color: var(--matn); border-radius: 14px; padding: 12px 14px;
    font: inherit; font-size: 14.5px; cursor: pointer; margin-bottom: 8px;
    transition: all .18s ease;
  }
  .variant:hover { border-color: #c6d1ee; }
  .variant.tanlangan {
    border-color: var(--asos); background: var(--asos-och); color: var(--asos); font-weight: 500;
  }
  .variant .harf {
    display: inline-grid; place-items: center; width: 22px; height: 22px;
    border-radius: 50%; background: var(--asos-och); color: var(--asos);
    font-size: 11.5px; font-weight: 600; margin-right: 10px; vertical-align: -5px;
  }
  .variant.tanlangan .harf { background: var(--asos); color: #fff; }

  /* --- Tush kundaligi --- */
  input[type=text], input[type=time] {
    background: var(--karta); color: var(--matn);
    border: 1px solid var(--chegara); border-radius: 14px;
    padding: 11px 14px; font-family: var(--sans); font-size: 14px;
    transition: border-color .18s, box-shadow .18s;
  }
  input[type=text]:focus, input[type=time]:focus {
    outline: none; border-color: var(--asos); box-shadow: 0 0 0 3px rgba(30,58,138,.09);
  }
  input[type=text]::placeholder { color: var(--matn-xira); }
  input[type=text] { width: 100%; margin-top: 8px; }

  .yozuv {
    background: var(--karta); border: 1px solid var(--chegara);
    border-radius: 14px; margin-bottom: 8px; overflow: hidden;
  }
  .yozuv-bosh {
    display: flex; align-items: center; gap: 9px; width: 100%;
    background: none; border: 0; color: var(--matn); font: inherit;
    padding: 11px 13px; cursor: pointer; text-align: left;
  }
  .yozuv-sana { color: var(--asos); font-size: 12px; font-weight: 500; flex: 0 0 auto; }
  .yozuv-qisqa {
    flex: 1; min-width: 0; font-size: 13px; color: var(--matn-xira);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .yozuv-strelka { flex: 0 0 auto; color: var(--asos); opacity: .55; font-size: 10px; }
  .yozuv-tan { padding: 0 13px 13px; font-size: 14px; white-space: pre-wrap; animation: ochil .28s ease; }
  .nishonlar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .nishon {
    font-size: 11.5px; font-weight: 500; color: var(--asos); background: var(--asos-och);

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ==================== Telegram WebApp (xavfsiz o'ram) ==================== */
/* SDK bo'lmasa ham (oddiy brauzer) hech qanday xato bermaydi */

const TG = (function () {
  try {
    return window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  } catch (e) { return null; }
})();

function tgTayyor() {
  if (!TG) return;
  try {
    TG.ready();
    TG.expand();
    if (TG.setHeaderColor) TG.setHeaderColor('#eef1f8');
    if (TG.setBackgroundColor) TG.setBackgroundColor('#eef1f8');
    if (TG.enableClosingConfirmation) TG.enableClosingConfirmation();
  } catch (e) {}
}

function haptic(tur) {
  if (!TG || !TG.HapticFeedback) return;
  try {
    if (tur === 'success' || tur === 'warning' || tur === 'error') {
      TG.HapticFeedback.notificationOccurred(tur);
    } else if (tur === 'select') {
      TG.HapticFeedback.selectionChanged();
    } else {
      TG.HapticFeedback.impactOccurred(tur || 'light');
    }
  } catch (e) {}
}

/* BackButton — kitob ichida ko'rsatiladi */
function backButton(korsat, ishlov) {
  if (!TG || !TG.BackButton) return function () {};
  try {
    if (!korsat) { TG.BackButton.hide(); return function () {}; }
    TG.BackButton.onClick(ishlov);
    TG.BackButton.show();
    return function () {
      try { TG.BackButton.offClick(ishlov); TG.BackButton.hide(); } catch (e) {}
    };
  } catch (e) { return function () {}; }
}

/* Hex rangni to'qlashtirish — muqova va hero gradienti uchun */
function qoraytir(hex, ulush) {
  try {
    const u = typeof ulush === 'number' ? ulush : .45;
    const t = String(hex).replace('#', '');
    const to = t.length === 3 ? t.split('').map(function (c) { return c + c; }).join('') : t;
    const n = parseInt(to, 16);
    const r = Math.round(((n >> 16) & 255) * (1 - u));
    const g = Math.round(((n >> 8) & 255) * (1 - u));
    const b = Math.round((n & 255) * (1 - u));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  } catch (e) { return '#152a63'; }
}

/* Telegram foydalanuvchisining ismi — bo'lmasa null */
function tgIsm() {
  try {
    const u = TG && TG.initDataUnsafe ? TG.initDataUnsafe.user : null;
    return u && u.first_name ? u.first_name : null;
  } catch (e) { return null; }
}

/* ==================== localStorage yordamchilari ==================== */

function kalit(kitobId, bolimIdx, mashqIdx) {
  return 'km_' + kitobId + '_' + bolimIdx + '_' + mashqIdx;
}

function oqi(k, standart) {
  try {
    const xom = window.localStorage.getItem(k);
    if (xom === null) return standart;
    return JSON.parse(xom);
  } catch (e) { return standart; }
}

/* Saqlash hodisasiga obuna — jarayon foizi jonli yangilanishi uchun */
const tinglovchilar = [];
let ogohSoat = null;

function ogohlantir() {
  if (ogohSoat) clearTimeout(ogohSoat);
  ogohSoat = setTimeout(function () {
    ogohSoat = null;
    tinglovchilar.slice().forEach(function (f) { try { f(); } catch (e) {} });
  }, 250);
}

function yoz(k, qiymat) {
  try { window.localStorage.setItem(k, JSON.stringify(qiymat)); ogohlantir(); return true; }
  catch (e) { return false; }
}

/* Har safar biror javob saqlanganda ortadigan hisoblagich */
function useSaqlashVersiya() {
  const [versiya, oVersiya] = useState(0);
  useEffect(function () {
    function ishlov() { oVersiya(function (v) { return v + 1; }); }
    tinglovchilar.push(ishlov);
    return function () {
      const i = tinglovchilar.indexOf(ishlov);
      if (i !== -1) tinglovchilar.splice(i, 1);
    };
  }, []);
  return versiya;
}

/* Saqlangan qiymatni komponent ichida boshqarish uchun umumiy hook */
function useSaqlash(k, standart) {
  const [qiymat, oQiymat] = useState(function () { return oqi(k, standart); });
  const [saqlandi, oSaqlandi] = useState(false);
  const soat = useRef(null);

  const yangila = useCallback(function (yangi) {
    oQiymat(yangi);
    yoz(k, yangi);
    oSaqlandi(true);
    if (soat.current) clearTimeout(soat.current);
    soat.current = setTimeout(function () { oSaqlandi(false); }, 1600);
  }, [k]);

  useEffect(function () {
    return function () { if (soat.current) clearTimeout(soat.current); };
  }, []);

  return [qiymat, yangila, saqlandi];
}

/* ==================== Jarayon hisobi ==================== */

/* Mashq "bajarilgan" deb hisoblanadimi — saqlangan qiymatga qarab */
function mashqBajarilgan(m, q) {
  if (q === null || q === undefined) return false;
  switch (m.turi) {
    case 'jurnal': return typeof q === 'string' && q.trim().length > 0;
    case 'checklist': return Array.isArray(q) && (m.bandlar || []).length > 0 && q.length >= m.bandlar.length;
    case 'slider': return typeof q === 'number';
    case 'test': return q !== null;
    case 'taymer': return Boolean(q && q.marta);
    case 'kundalik': return Array.isArray(q) && q.length > 0;
    case 'eslatma': return Boolean(q && q.yoniq);
    default: return false;
  }
}

/* Kitob bo'yicha: jami mashq, bajarilgani va foizi */
function kitobHisob(kitob) {
  let jami = 0, bajarildi = 0;
  (kitob.bolimlar || []).forEach(function (b, bi) {
    (b.mashqlar || []).forEach(function (m, mi) {
      jami++;
      if (mashqBajarilgan(m, oqi(kalit(kitob.id, bi, mi), null))) bajarildi++;
    });
  });
  return { jami: jami, bajarildi: bajarildi, foiz: jami ? Math.round(bajarildi / jami * 100) : 0 };
}

/* Barcha kitoblardan berilgan turdagi mashqlarni yig'ish */
function mashqlarniYig(barcha, turi) {
  const natija = [];
  Object.keys(barcha || {}).forEach(function (id) {
    const kitob = barcha[id];
    if (!kitob) return;
    (kitob.bolimlar || []).forEach(function (b, bi) {
      (b.mashqlar || []).forEach(function (m, mi) {
        if (m.turi !== turi) return;
        natija.push({
          kitobId: id, kitobNomi: kitob.nomi, bolim: b.sarlavha,
          m: m, k: kalit(id, bi, mi), qiymat: oqi(kalit(id, bi, mi), null)
        });
      });
    });
  });
  return natija;
}

/* ==================== Mashqlar ==================== */

/* --- Jurnal: textarea + avtosaqlash --- */
function Jurnal(props) {
  const [matn, yangila, saqlandi] = useSaqlash(props.k, '');
  return (
    <div className="mashq">
      <span className="mashq-turi">✍️ Jurnal</span>
      <div className="mashq-savol">{props.m.savol}</div>
      <textarea
        value={matn}
        placeholder="Bu yerga yozing…"
        onChange={function (e) { yangila(e.target.value); }}
      />
      <div className={'holat' + (saqlandi ? ' saqlandi' : '')}>
        {saqlandi ? '✓ Saqlandi' : (matn ? matn.trim().split(/\s+/).filter(Boolean).length + ' so‘z' : 'Yozganingiz shu qurilmada saqlanadi')}
      </div>
    </div>
  );
}

/* --- Checklist: belgilar + progress --- */
function Checklist(props) {
  const bandlar = props.m.bandlar || [];
  const [belgilar, yangila] = useSaqlash(props.k, []);
  const xavfsiz = Array.isArray(belgilar) ? belgilar : [];

  function almashtir(i) {
    haptic('select');
    const yangi = xavfsiz.indexOf(i) === -1
      ? xavfsiz.concat([i])
      : xavfsiz.filter(function (x) { return x !== i; });
    yangila(yangi);
    if (yangi.length === bandlar.length && bandlar.length > 0) haptic('success');
  }

  const foiz = bandlar.length ? Math.round(xavfsiz.length / bandlar.length * 100) : 0;

  return (
    <div className="mashq">
      <span className="mashq-turi">☑️ Ro'yxat</span>
      {props.m.sarlavha ? <div className="mashq-savol">{props.m.sarlavha}</div> : null}
      <div>
        {bandlar.map(function (band, i) {
          const bor = xavfsiz.indexOf(i) !== -1;
          return (
            <div
              key={i}
              className={'band' + (bor ? ' belgili' : '')}
              role="checkbox"
              aria-checked={bor}
              tabIndex={0}
              onClick={function () { almashtir(i); }}
              onKeyDown={function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); almashtir(i); } }}
            >
              <span className="quti">{bor ? '✓' : ''}</span>
              <span className="yorliq">{band}</span>
            </div>
          );
        })}
      </div>
      <div className="progress-chiziq"><i style={{ width: foiz + '%' }} /></div>
      <div className="holat">{xavfsiz.length} / {bandlar.length} bajarildi — {foiz}%</div>
    </div>
  );
}

/* --- Slider: qiymat + "O'tgan safar" --- */
function Slider(props) {
  const min = typeof props.m.min === 'number' ? props.m.min : 1;
  const max = typeof props.m.max === 'number' ? props.m.max : 10;
  const oldingi = useRef(oqi(props.k, null));
  const [qiymat, yangila, saqlandi] = useSaqlash(
    props.k,
    oldingi.current === null ? Math.round((min + max) / 2) : oldingi.current
  );

  return (
    <div className="mashq">
      <span className="mashq-turi">🎚 Baholash</span>
      <div className="mashq-savol">{props.m.savol}</div>
      <div className="slider-qiymat">{qiymat}</div>
      <input
        type="range"
        min={min}
        max={max}
        step={1}
        value={qiymat}
        onChange={function (e) { yangila(Number(e.target.value)); }}
        onMouseUp={function () { haptic('light'); }}
        onTouchEnd={function () { haptic('light'); }}
      />
      <div className="yorliqlar">
        <span>{props.m.min_yorliq || min}</span>
        <span>{props.m.max_yorliq || max}</span>
      </div>
      <div className={'holat' + (saqlandi ? ' saqlandi' : '')}>
        {oldingi.current !== null
          ? 'O‘tgan safar: ' + oldingi.current
          : (saqlandi ? '✓ Saqlandi' : 'Qiymat avtomatik saqlanadi')}
      </div>
    </div>
  );
}

/* --- Taymer: aylana progress + boshlash/pauza/qayta --- */
function Taymer(props) {
  const jami = Math.max(1, Math.round((props.m.daqiqa || 5) * 60));
  const [qolgan, oQolgan] = useState(jami);
  const [ketmoqda, oKetmoqda] = useState(false);
  const [tugadi, oTugadi] = useState(false);
  const [natija, yangilaNatija] = useSaqlash(props.k, null);
  const marta = (natija && natija.marta) || 0;

  /* Tugaganda hisobni oshirib saqlaydi — jarayon foizi shundan chiqadi */
  const belgilaTugadi = useCallback(function () {
    const eski = oqi(props.k, null);
    const n = ((eski && eski.marta) || 0) + 1;
    yangilaNatija({ marta: n, oxirgi: sanaKalit(new Date()) });
  }, [props.k, yangilaNatija]);

  useEffect(function () {
    if (!ketmoqda) return;
    const id = setInterval(function () {
      oQolgan(function (avvalgi) {
        if (avvalgi <= 1) {
          clearInterval(id);
          oKetmoqda(false);
          oTugadi(true);
          haptic('success');
          belgilaTugadi();
          return 0;
        }
        return avvalgi - 1;
      });
    }, 1000);
    return function () { clearInterval(id); };
  }, [ketmoqda, belgilaTugadi]);

  function boshla() {
    haptic('medium');
    if (tugadi) { oQolgan(jami); oTugadi(false); }
    oKetmoqda(!ketmoqda);
  }
  function qayta() {
    haptic('light');
    oKetmoqda(false); oTugadi(false); oQolgan(jami);
  }

  const daq = Math.floor(qolgan / 60);
  const son = qolgan % 60;
  const R = 60;
  const uzunlik = 2 * Math.PI * R;
  const ulush = qolgan / jami;

  return (
    <div className="mashq">
      <span className="mashq-turi">⏳ Taymer</span>
      {props.m.korsatma ? <div className="mashq-savol">{props.m.korsatma}</div> : null}
      <div className="taymer-orin">
        <div className="halqa">
          <svg width="132" height="132" viewBox="0 0 132 132">
            <circle className="iz" cx="66" cy="66" r={R} />
            <circle
              className="yoy" cx="66" cy="66" r={R}
              strokeDasharray={uzunlik}
              strokeDashoffset={uzunlik * (1 - ulush)}
            />
          </svg>
          <div className="vaqt">{daq}:{son < 10 ? '0' + son : son}</div>
        </div>
        <div className="tugmalar">
          <button className="tug asosiy" onClick={boshla}>
            {tugadi ? 'Qaytadan' : (ketmoqda ? 'Pauza' : (qolgan === jami ? 'Boshlash' : 'Davom ettirish'))}
          </button>
          <button className="tug jim" onClick={qayta}>Qayta</button>
        </div>
        {tugadi ? <div className="izoh" style={{ width: '100%' }}>🌙 Mashq tugadi. O'zingizni qanday his qilyapsiz?</div> : null}
      </div>
      <div className="holat">
        {marta ? 'Bu mashqni ' + marta + ' marta bajardingiz' : 'Taymer tugaganda bajarilgan deb belgilanadi'}
      </div>
    </div>
  );
}

/* --- Test: variant tanlanganda izoh ochiladi --- */
function Test(props) {
  const variantlar = props.m.variantlar || [];
  const izohlar = props.m.izohlar || [];
  const [tanlov, yangila] = useSaqlash(props.k, null);
  const harflar = 'ABCDEFGH';

  function tanla(i) {
    haptic('select');
    yangila(tanlov === i ? null : i);
  }

  return (
    <div className="mashq">
      <span className="mashq-turi">🔮 Savol</span>
      <div className="mashq-savol">{props.m.savol}</div>
      {variantlar.map(function (v, i) {
        return (
          <button
            key={i}
            className={'variant' + (tanlov === i ? ' tanlangan' : '')}
            onClick={function () { tanla(i); }}
          >
            <span className="harf">{harflar[i] || (i + 1)}</span>{v}
          </button>
        );
      })}
      {tanlov !== null && izohlar[tanlov] ? <div className="izoh">{izohlar[tanlov]}</div> : null}
      <div className="holat">To'g'ri yoki noto'g'ri javob yo'q — bu o'zingizni anglash uchun.</div>
    </div>
  );
}

/* --- Sana yordamchilari --- */
const OYLAR = ['yanv', 'fev', 'mart', 'apr', 'may', 'iyun', 'iyul', 'avg', 'sent', 'okt', 'noy', 'dek'];

function ikki(n) { return n < 10 ? '0' + n : String(n); }

function sanaKalit(d) {
  return d.getFullYear() + '-' + ikki(d.getMonth() + 1) + '-' + ikki(d.getDate());
}

function sanaChirey(kalitMatn) {
  const q = String(kalitMatn || '').split('-');
  if (q.length !== 3) return kalitMatn || '';
  return Number(q[2]) + ' ' + (OYLAR[Number(q[1]) - 1] || '') ;
}

/* Ketma-ket kunlar seriyasi: bugundan (yoki kechadan) orqaga sanaladi */
function seriya(sanalar) {
  const bor = {};
  sanalar.forEach(function (s) { bor[s] = true; });
  const kun = new Date();
  if (!bor[sanaKalit(kun)]) kun.setDate(kun.getDate() - 1);
  let n = 0;
  while (bor[sanaKalit(kun)]) { n++; kun.setDate(kun.getDate() - 1); }
  return n;
}

/* --- Kundalik: sanali yozuvlar + belgilar chastotasi --- */
function Kundalik(props) {
  const [yozuvlar, yangila, saqlandi] = useSaqlash(props.k, []);
  const royxat = Array.isArray(yozuvlar) ? yozuvlar : [];
  const [matn, oMatn] = useState('');
  const [belgi, oBelgi] = useState('');
  const [ochiq, oOchiq] = useState(null);

  function qosh() {
    const tan = matn.trim();
    if (!tan) return;
    haptic('success');
    const bel = belgi.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    const hozir = new Date();
    yangila([{
      sana: sanaKalit(hozir),
      vaqt: ikki(hozir.getHours()) + ':' + ikki(hozir.getMinutes()),
      matn: tan,
      belgilar: bel
    }].concat(royxat));
    oMatn(''); oBelgi(''); oOchiq(null);
  }

  function ochir(i) {
    haptic('warning');
    yangila(royxat.filter(function (_, j) { return j !== i; }));
    oOchiq(null);
  }

  /* Takrorlanuvchi belgilar — "tush belgilari"ni shu yerdan topasiz */
  const hisob = {};
  royxat.forEach(function (y) {
    (y.belgilar || []).forEach(function (b) {
      const n = b.toLowerCase();
      hisob[n] = (hisob[n] || 0) + 1;
    });
  });
  const tez = Object.keys(hisob)
    .sort(function (a, b) { return hisob[b] - hisob[a]; })
    .slice(0, 8);

  const kunlar = seriya(royxat.map(function (y) { return y.sana; }));

  return (
    <div className="mashq">
      <span className="mashq-turi">🌙 Kundalik</span>
      {props.m.sarlavha ? <div className="mashq-savol">{props.m.sarlavha}</div> : null}
      {props.m.korsatma ? <div className="izoh" style={{ marginBottom: 12 }}>{props.m.korsatma}</div> : null}

      <textarea
        value={matn}
        placeholder={props.m.joy_matn || 'Eslaganingizni yozing — parcha bo‘lsa ham…'}
        onChange={function (e) { oMatn(e.target.value); }}
      />
      <input
        type="text"
        value={belgi}
        placeholder={props.m.belgi_matn || 'Belgilar, vergul bilan: suv, maktab, uchish'}
        onChange={function (e) { oBelgi(e.target.value); }}
      />
      <div className="tugmalar" style={{ justifyContent: 'flex-start', marginTop: 10 }}>
        <button className="tug asosiy" onClick={qosh} disabled={!matn.trim()}>Yozuvni saqlash</button>
      </div>

      {tez.length ? (
        <div style={{ marginTop: 14 }}>
          <div className="holat">Takrorlanayotgan belgilar — ehtimoliy tush belgilaringiz:</div>
          <div className="nishonlar">
            {tez.map(function (b) {
              return <span key={b} className="nishon">{b}<b>{hisob[b]}</b></span>;
            })}
          </div>
        </div>
      ) : null}

      {royxat.length ? (
        <div style={{ marginTop: 14 }}>
          {royxat.map(function (y, i) {
            return (
              <div key={i} className="yozuv">
                <button
                  className="yozuv-bosh"
                  onClick={function () { haptic('select'); oOchiq(ochiq === i ? null : i); }}
                  aria-expanded={ochiq === i}
                >
                  <span className="yozuv-sana">{sanaChirey(y.sana)}{y.vaqt ? ' · ' + y.vaqt : ''}</span>
                  <span className="yozuv-qisqa">{y.matn}</span>
                  <span className="yozuv-strelka">{ochiq === i ? '▲' : '▼'}</span>
                </button>
                {ochiq === i ? (
                  <div className="yozuv-tan">
                    {y.matn}
                    {(y.belgilar || []).length ? (
                      <div className="nishonlar">
                        {y.belgilar.map(function (b, j) { return <span key={j} className="nishon">{b}</span>; })}
                      </div>
                    ) : null}
                    <div className="tugmalar" style={{ justifyContent: 'flex-start', marginTop: 10 }}>
                      <button className="tug jim" onClick={function () { ochir(i); }}>O'chirish</button>
                    </div>
                  </div>
                ) : null}
              </div>
            );
          })}
        </div>
      ) : null}

      <div className={'holat' + (saqlandi ? ' saqlandi' : '')}>
        {saqlandi
          ? '✓ Saqlandi'
          : (royxat.length
              ? royxat.length + ' ta yozuv' + (kunlar > 1 ? ' · ketma-ket ' + kunlar + ' kun' : '')
              : 'Hali yozuv yo‘q. Eng qisqa parcha ham hisoblanadi.')}
      </div>
    </div>
  );
}

/* --- Eslatma: bildirishnoma + kalendarga eksport --- */
function bildirishnomaHolati() {
  try {
    if (typeof window.Notification === 'undefined') return 'yoq';
    return window.Notification.permission;
  } catch (e) { return 'yoq'; }
}

function Eslatma(props) {
  const standart = {
    yoniq: false,
    vaqtlar: Array.isArray(props.m.vaqtlar) && props.m.vaqtlar.length
      ? props.m.vaqtlar
      : ['09:00', '13:00', '17:00', '21:00']
  };
  const [holat, yangila] = useSaqlash(props.k, standart);
  const h = (holat && typeof holat === 'object') ? holat : standart;
  const vaqtlar = Array.isArray(h.vaqtlar) ? h.vaqtlar : standart.vaqtlar;

  const [ruxsat, oRuxsat] = useState(bildirishnomaHolati);
  const [yangi, oYangi] = useState('12:00');
  const [xabar, oXabar] = useState(null);
  const oxirgi = useRef('');

  const sarlavha = props.m.sarlavha || 'Eslatma';
  const matn = props.m.matn || 'Reallik tekshiruvi vaqti keldi.';

  /* Ilova ochiq turganda vaqtni kuzatib boradi */
  useEffect(function () {
    if (!h.yoniq || !vaqtlar.length) return;
    function tekshir() {
      const d = new Date();
      const hozir = ikki(d.getHours()) + ':' + ikki(d.getMinutes());
      if (vaqtlar.indexOf(hozir) === -1) return;
      const belgi = sanaKalit(d) + ' ' + hozir;
      if (oxirgi.current === belgi) return;
      oxirgi.current = belgi;
      haptic('warning');
      oXabar(matn);
      try {
        if (typeof window.Notification !== 'undefined' && window.Notification.permission === 'granted') {
          new window.Notification(sarlavha, { body: matn });
        }
      } catch (e) { /* bildirishnoma yo'q bo'lsa ham ilova ishlayveradi */ }
    }
    tekshir();
    const id = setInterval(tekshir, 15000);
    return function () { clearInterval(id); };
  }, [h.yoniq, vaqtlar.join(','), sarlavha, matn]);

  function almashtir() {
    haptic('medium');
    const keyingi = !h.yoniq;
    yangila({ yoniq: keyingi, vaqtlar: vaqtlar });
    if (keyingi) soraRuxsat();
    else oXabar(null);
  }

  function soraRuxsat() {
    try {
      if (typeof window.Notification === 'undefined') return;
      if (window.Notification.permission === 'default') {
        window.Notification.requestPermission().then(function (r) { oRuxsat(r); });
      } else {
        oRuxsat(window.Notification.permission);
      }
    } catch (e) { oRuxsat('yoq'); }
  }

  function vaqtQosh() {
    if (!yangi || vaqtlar.indexOf(yangi) !== -1) return;
    haptic('select');
    const r = vaqtlar.concat([yangi]).sort();
    yangila({ yoniq: h.yoniq, vaqtlar: r });
  }

  function vaqtOchir(v) {
    haptic('light');
    yangila({ yoniq: h.yoniq, vaqtlar: vaqtlar.filter(function (x) { return x !== v; }) });
  }

  /* Telefon kalendariga har kuni takrorlanuvchi eslatma sifatida yuklab olish */
  function kalendarga() {
    haptic('medium');
    const d = new Date();
    const bugun = String(d.getFullYear()) + ikki(d.getMonth() + 1) + ikki(d.getDate());
    const qismlar = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Kitob Magzi//UZ//', 'CALSCALE:GREGORIAN'
    ];
    vaqtlar.forEach(function (v, i) {
      const soat = v.replace(':', '') + '00';
      qismlar.push(
        'BEGIN:VEVENT',
        'UID:' + props.k + '-' + i + '-' + bugun + '@kitob-magzi',
        'DTSTAMP:' + bugun + 'T000000Z',
        'DTSTART:' + bugun + 'T' + soat,
        'DURATION:PT5M',
        'RRULE:FREQ=DAILY',
        'SUMMARY:' + sarlavha,
        'DESCRIPTION:' + matn.replace(/\n/g, ' '),
        'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY',
        'DESCRIPTION:' + sarlavha, 'END:VALARM',
        'END:VEVENT'
      );
    });
    qismlar.push('END:VCALENDAR');
    try {
      const blob = new Blob([qismlar.join('\r\n')], { type: 'text/calendar' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'eslatma.ics';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    } catch (e) {
      oXabar('Bu yerda faylni yuklab bo‘lmadi. Ilovani brauzerda oching yoki vaqtlarni telefon eslatmasiga qo‘lda kiriting.');
    }
  }

  /* Keyingi eslatmagacha qancha qolgani */
  function keyingiVaqt() {
    if (!vaqtlar.length) return null;
    const d = new Date();
    const hozir = d.getHours() * 60 + d.getMinutes();
    let eng = null;
    vaqtlar.forEach(function (v) {
      const q = v.split(':');
      let daq = Number(q[0]) * 60 + Number(q[1]) - hozir;
      if (daq <= 0) daq += 24 * 60;
      if (eng === null || daq < eng) eng = daq;
    });
    if (eng === null) return null;
    const s = Math.floor(eng / 60);
    return s ? s + ' soat ' + (eng % 60) + ' daqiqa' : eng + ' daqiqa';
  }

  const qoldi = h.yoniq ? keyingiVaqt() : null;

  return (
    <div className="mashq">
      <span className="mashq-turi">🔔 Eslatma</span>
      <div className="mashq-savol">{sarlavha}</div>
      {props.m.korsatma ? <div className="izoh" style={{ marginBottom: 12 }}>{props.m.korsatma}</div> : null}

      <button className={'kalit-tugma' + (h.yoniq ? ' yoniq' : '')} onClick={almashtir} aria-pressed={h.yoniq}>
        <span className="kalit-yugurt" />
        <span>{h.yoniq ? 'Eslatma yoqilgan' : 'Eslatmani yoqish'}</span>
      </button>

      <div className="qatorlar">
        {vaqtlar.map(function (v) {
          return (
            <span key={v} className={'vaqt-nishon' + (h.yoniq ? '' : ' ochiq-holat')}>
              {v}
              <button onClick={function () { vaqtOchir(v); }} aria-label={v + ' ni o‘chirish'}>×</button>
            </span>
          );
        })}
      </div>

      <div className="qatorlar" style={{ marginTop: 10 }}>
        <input type="time" value={yangi} onChange={function (e) { oYangi(e.target.value); }} />
        <button className="tug" onClick={vaqtQosh}>Vaqt qo'shish</button>
        <button className="tug jim" onClick={kalendarga}>Kalendarga qo'shish</button>
      </div>

      {ruxsat === 'denied' && h.yoniq ? (
        <div className="holat">Bildirishnomaga ruxsat berilmagan — eslatma ilova ichida ko‘rinadi.</div>
      ) : null}
      {ruxsat === 'default' && h.yoniq ? (
        <div className="tugmalar" style={{ justifyContent: 'flex-start', marginTop: 10 }}>
          <button className="tug" onClick={soraRuxsat}>Bildirishnomaga ruxsat berish</button>
        </div>
      ) : null}

      {xabar ? <div className="izoh" style={{ marginTop: 12 }}>🔔 {xabar}</div> : null}

      <div className="holat">
        {h.yoniq
          ? (qoldi ? 'Keyingi eslatma ' + qoldi + 'dan keyin' : 'Vaqt qo‘shing')
          : 'Vaqtlar shu qurilmada saqlanadi'}
      </div>
      <div className="holat">
        Bildirishnoma ilova ochiq turganda ishlaydi. Kun bo‘yi eslatib turishi uchun
        «Kalendarga qo‘shish» tugmasi orqali telefon kalendariga o‘tkazing.
      </div>
    </div>
  );
}

/* --- Mashq turini tanlovchi --- */
function Mashq(props) {
  const m = props.m;
  const k = kalit(props.kitobId, props.bolimIdx, props.mashqIdx);
  if (m.turi === 'jurnal') return <Jurnal m={m} k={k} />;
  if (m.turi === 'checklist') return <Checklist m={m} k={k} />;
  if (m.turi === 'slider') return <Slider m={m} k={k} />;
  if (m.turi === 'taymer') return <Taymer m={m} k={k} />;
  if (m.turi === 'test') return <Test m={m} k={k} />;
  if (m.turi === 'kundalik') return <Kundalik m={m} k={k} />;
  if (m.turi === 'eslatma') return <Eslatma m={m} k={k} />;
  return null;
}

            </div>
          )}

      ) : null}

  );
}

/* ==================== Kitob sahifasi ==================== */

function KitobSahifa(props) {
  const [kitob, oKitob] = useState(null);
  const [xato, oXato] = useState(null);
  const [ochiq, oOchiq] = useState(0);
  useSaqlashVersiya();

  useEffect(function () {
    let bekor = false;
    oKitob(null); oXato(null);
    fetch('books/' + props.id + '.json', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) { if (!bekor) oKitob(d); })
      .catch(function (e) { if (!bekor) oXato(String(e.message || e)); });
    return function () { bekor = true; };
  }, [props.id]);

  useEffect(function () { window.scrollTo(0, 0); }, [props.id]);

  const panel = (
    <div className="panel">
      <button className="dumaloq-tug orqaga" onClick={props.orqaga} aria-label="Ortga"><Ikonka nom="chap" olcham={18} /></button>
      <h2>Kitob</h2>
      <span style={{ width: 40 }} />
    </div>
  );

  if (xato) {
    return (
      <div>
        {panel}
        <div className="xabar">
          <span className="belgi">!</span>
          Kitobni yuklab bo'lmadi.<br /><small>{xato}</small>
        </div>
      </div>
    );
  }

  if (!kitob) {
    return (
      <div>
        {panel}
        <div className="yuklanmoqda"><div className="aylana"></div></div>
      </div>
    );
  }

  const bolimlar = kitob.bolimlar || [];
  const hisob = kitobHisob({ id: kitob.id || props.id, bolimlar: bolimlar });
  const rang = props.rang || '#1e3a8a';

  return (
    <div>
      {panel}

      <div className="hero" style={{ background: 'linear-gradient(158deg, ' + rang + ', ' + qoraytir(rang) + ')' }}>
        <div className="hero-muqova">✦</div>
        <h2>{kitob.nomi}</h2>
        <div className="muallif">{kitob.muallif}</div>
        <div className="hero-stat">
          <div><b>{bolimlar.length}</b><span>Bo'lim</span></div>
          <div><b>{hisob.jami}</b><span>Mashq</span></div>
          <div><b>{hisob.foiz}%</b><span>Bajarildi</span></div>
        </div>
      </div>

      {kitob.kirish ? <p className="kirish">{kitob.kirish}</p> : null}

      <div className="satr-bosh">
        <h3>Bo'limlar</h3>
        <span>{hisob.bajarildi} / {hisob.jami} mashq</span>
      </div>

      {bolimlar.map(function (b, i) {
        return (
          <Bolim
            key={i}
            b={b}
            idx={i}
            kitobId={kitob.id || props.id}
            ochiq={ochiq === i}
            almashtir={function () {
              haptic('light');
              oOchiq(ochiq === i ? -1 : i);
            }}
          />
        );
      })}

      <div className="izohcha">Javoblaringiz faqat shu qurilmada saqlanadi.</div>
    </div>
  );
}

/* ==================== Kitoblar ro'yxati (bosh sahifa) ==================== */

/* Kitoblarni "turkum" maydoni bo'yicha guruhlaydi; turkumsizlari oxirida */
const TURKUMSIZ = 'Boshqa kitoblar';

function turkumlarga(kitoblar, oxirgi) {
  const tartib = [];
  const xarita = {};
  kitoblar.forEach(function (k) {
    const nomi = k.turkum || TURKUMSIZ;
    if (!xarita[nomi]) { xarita[nomi] = []; tartib.push(nomi); }
    xarita[nomi].push(k);
  });
  tartib.sort(function (a, b) {
    return (a === TURKUMSIZ ? 1 : 0) - (b === TURKUMSIZ ? 1 : 0);
  });
  return tartib.map(function (nomi) {
    /* Oxirgi ochilgan kitob o'z turkumi boshida turadi */
    const ro = xarita[nomi].slice().sort(function (a, b) {
      return (b.id === oxirgi ? 1 : 0) - (a.id === oxirgi ? 1 : 0);
    });
    return { nomi: nomi, kitoblar: ro };
  });
}

/* Bir nechta kitobning umumiy jarayoni */
function guruhHisob(kitoblar, barcha) {
  let jami = 0, bajarildi = 0;
  (kitoblar || []).forEach(function (k) {
    const kitob = barcha ? barcha[k.id] : null;
    if (!kitob) return;
    const h = kitobHisob(kitob);
    jami += h.jami; bajarildi += h.bajarildi;
  });
  return { jami: jami, bajarildi: bajarildi, foiz: jami ? Math.round(bajarildi / jami * 100) : 0 };
}

/* --- Bitta kitob kartasi (2 ustunli to'r uchun) --- */
function KitobKarta(props) {

/* --- Turkum kartasi: bosilganda turkum sahifasi ochiladi --- */

  if (s < 5) return 'Xayrli tun';
  if (s < 11) return 'Xayrli tong';
  if (s < 17) return 'Xayrli kun';
  return 'Xayrli kech';
}

/* ==================== Jarayon sahifasi ==================== */

function Jarayon(props) {
  const kitoblar = props.kitoblar || [];
  const barcha = props.barcha || {};

  let jami = 0, bajarildi = 0;
  const qatorlar = kitoblar.map(function (k) {
    const kitob = barcha[k.id];
    const h = kitob ? kitobHisob(kitob) : { jami: 0, bajarildi: 0, foiz: 0 };
    jami += h.jami; bajarildi += h.bajarildi;
    return { k: k, h: h };
  });

  /* Kundalik yozuvlari va ketma-ket kunlar — barcha kitoblar bo'ylab */
  const yozuvlar = [];
  mashqlarniYig(barcha, 'kundalik').forEach(function (x) {
    if (Array.isArray(x.qiymat)) x.qiymat.forEach(function (y) { yozuvlar.push(y); });
  });
  const kunlar = seriya(yozuvlar.map(function (y) { return y.sana; }));

  return (
    <div>
      <Bosh
        nomi="Jarayon"
        chap={<button className="dumaloq-tug" onClick={props.orqaga} aria-label="Ortga"><Ikonka nom="chap" olcham={18} /></button>}
      />

      <div className="stat-panel">
        <div className="stat-quti"><b>{bajarildi}</b><span>Bajarilgan</span></div>
        <div className="stat-quti"><b>{jami ? Math.round(bajarildi / jami * 100) : 0}%</b><span>Umumiy</span></div>
        <div className="stat-quti"><b>{kunlar}</b><span>Ketma-ket kun</span></div>
      </div>

      {qatorlar.length === 0 ? (
        <div className="yuklanmoqda"><div className="aylana"></div></div>
      ) : turkumlarga(kitoblar).map(function (guruh) {
        let gJami = 0, gBajarildi = 0;
        guruh.kitoblar.forEach(function (k) {
          const kitob = barcha[k.id];
          if (!kitob) return;
          const h = kitobHisob(kitob);
          gJami += h.jami; gBajarildi += h.bajarildi;
        });
        return (
          <div key={guruh.nomi}>
            <BoshQator nomi={guruh.nomi} ong={gBajarildi + ' / ' + gJami + ' mashq'} />
            {guruh.kitoblar.map(function (k) {
              const kitob = barcha[k.id];
              const h = kitob ? kitobHisob(kitob) : { jami: 0, bajarildi: 0, foiz: 0 };
              const rang = k.rang || '#1e3a8a';
              return (
                <button key={k.id} className="qator-karta" onClick={function () { props.och(k.id); }}>
                  <div
                    className="qator-nishon"
                    style={{ background: 'linear-gradient(150deg, ' + rang + ', ' + qoraytir(rang, .3) + ')', color: '#fff' }}
                  >✦</div>
                  <div className="qator-matn">
                    <h4>{k.nomi}</h4>
                    <p>{h.bajarildi} / {h.jami} mashq</p>
                    <div className="progress-chiziq" style={{ marginTop: 8 }}>
                      <i style={{ width: h.foiz + '%' }} />
                    </div>
                  </div>
                  <span className="qator-son">{h.foiz}%</span>
                </button>
              );
            })}
          </div>
        );
      })}

      <div className="izohcha">Foiz saqlangan javoblardan hisoblanadi</div>
    </div>
  );
}

/* ==================== Kundalik sahifasi ==================== */

function KundalikSahifa(props) {
  const [qidiruv, oQidiruv] = useState('');
  const barcha = props.barcha || {};

  const hammasi = [];
  mashqlarniYig(barcha, 'kundalik').forEach(function (x) {
    if (!Array.isArray(x.qiymat)) return;
    x.qiymat.forEach(function (y) {
      hammasi.push({
        sana: y.sana, vaqt: y.vaqt, matn: y.matn, belgilar: y.belgilar || [],
        kitobId: x.kitobId, kitobNomi: x.kitobNomi, mashqNomi: x.m.sarlavha || 'Kundalik'
      });
    });
  });
  mashqlarniYig(barcha, 'jurnal').forEach(function (x) {
    if (typeof x.qiymat === 'string' && x.qiymat.trim()) {
      hammasi.push({
        sana: null, vaqt: null, matn: x.qiymat, belgilar: [],
        kitobId: x.kitobId, kitobNomi: x.kitobNomi, mashqNomi: 'Jurnal — ' + x.bolim
      });
    }
  });
  hammasi.sort(function (a, b) { return String(b.sana || '').localeCompare(String(a.sana || '')); });

  const sorov = qidiruv.trim().toLowerCase();
  const koringan = sorov
    ? hammasi.filter(function (y) {
        return (y.matn + ' ' + y.belgilar.join(' ') + ' ' + y.kitobNomi).toLowerCase().indexOf(sorov) !== -1;
      })
    : hammasi;

  const kunlar = seriya(hammasi.map(function (y) { return y.sana; }).filter(Boolean));

  return (
    <div>
      <Bosh
        nomi="Kundalik"
        chap={<button className="dumaloq-tug" onClick={props.orqaga} aria-label="Ortga"><Ikonka nom="chap" olcham={18} /></button>}
      />

      <div className="stat-panel">
        <div className="stat-quti"><b>{hammasi.length}</b><span>Yozuv</span></div>
        <div className="stat-quti"><b>{kunlar}</b><span>Ketma-ket kun</span></div>
        <div className="stat-quti"><b>{Object.keys(barcha).length}</b><span>Kitob</span></div>
      </div>

      <Qidiruv qiymat={qidiruv} oQiymat={oQidiruv} joy="Yozuvlar ichidan qidirish" />

      {hammasi.length === 0 ? (
        <div className="xabar">
          <span className="belgi"><Ikonka nom="qalam" olcham={26} /></span>
          Hali yozuv yo'q.<br />
          <small>Kitoblardagi kundalik va jurnal mashqlariga yozganlaringiz shu yerda to'planadi.</small>
        </div>
      ) : koringan.length === 0 ? (
        <div className="xabar"><span className="belgi">☾</span>Bunday yozuv topilmadi.</div>
      ) : (
        koringan.map(function (y, i) {
          return (
            <button key={i} className="qator-karta" onClick={function () { props.och(y.kitobId); }}>
              <div className="qator-nishon"><Ikonka nom={y.sana ? 'kitob' : 'qalam'} /></div>
              <div className="qator-matn">
                <h4>{y.sana ? sanaChirey(y.sana) + (y.vaqt ? ' · ' + y.vaqt : '') : y.mashqNomi}</h4>
                <p style={{ color: '#1e3a8a', fontWeight: 500 }}>{y.kitobNomi}</p>
                <p style={{ whiteSpace: 'normal', marginTop: 3 }}>{y.matn.length > 90 ? y.matn.slice(0, 90) + '…' : y.matn}</p>
                {y.belgilar.length ? (
                  <div className="nishonlar">
                    {y.belgilar.map(function (b, j) { return <span key={j} className="nishon">{b}</span>; })}
                  </div>
                ) : null}
              </div>
            </button>
          );
        })
      )}
    </div>
  );
}

/* ==================== Eslatmalar sahifasi ==================== */

function EslatmaSahifa(props) {
  const barcha = props.barcha || {};
  const [belgi, oBelgi] = useState(0);
  const royxat = mashqlarniYig(barcha, 'eslatma');

  function almashtir(x) {
    haptic('medium');
    const eski = oqi(x.k, null);
    const vaqtlar = (eski && eski.vaqtlar) || x.m.vaqtlar || [];
    yoz(x.k, { yoniq: !(eski && eski.yoniq), vaqtlar: vaqtlar });
    oBelgi(belgi + 1);
  }

  const yoniq = royxat.filter(function (x) { return x.qiymat && x.qiymat.yoniq; });

  return (
    <div>
      <Bosh
        nomi="Eslatmalar"
        chap={<button className="dumaloq-tug" onClick={props.orqaga} aria-label="Ortga"><Ikonka nom="chap" olcham={18} /></button>}
      />

      <div className="stat-panel">
        <div className="stat-quti"><b>{yoniq.length}</b><span>Yoqilgan</span></div>
        <div className="stat-quti"><b>{royxat.length}</b><span>Jami</span></div>
        <div className="stat-quti">
          <b>{yoniq.reduce(function (n, x) { return n + ((x.qiymat && x.qiymat.vaqtlar) || []).length; }, 0)}</b>
          <span>Kunlik signal</span>
        </div>
      </div>

      {royxat.length === 0 ? (
        <div className="xabar">
          <span className="belgi"><Ikonka nom="qongiroq" olcham={26} /></span>
          Eslatmali mashq topilmadi.
        </div>
      ) : (
        <div>
          <BoshQator nomi="Barcha eslatmalar" />
          {royxat.map(function (x, i) {
            const yoq = Boolean(x.qiymat && x.qiymat.yoniq);
            const vaqtlar = (x.qiymat && x.qiymat.vaqtlar) || x.m.vaqtlar || [];
            return (
              <div key={i} className="qator-karta jim" style={{ alignItems: 'flex-start' }}>
                <div className="qator-nishon" style={yoq ? { background: '#1e3a8a', color: '#fff' } : null}><Ikonka nom="qongiroq" /></div>
                <div className="qator-matn">
                  <h4>{x.m.sarlavha || 'Eslatma'}</h4>
                  <p>{x.kitobNomi}</p>
                  <div className="nishonlar">
                    {vaqtlar.map(function (v) { return <span key={v} className="nishon">{v}</span>; })}
                  </div>
                  <div className="tugmalar" style={{ justifyContent: 'flex-start', marginTop: 10 }}>
                    <button className={'tug' + (yoq ? '' : ' asosiy')} onClick={function () { almashtir(x); }}>
                      {yoq ? "O'chirish" : 'Yoqish'}
                    </button>
                    <button className="tug jim" onClick={function () { props.och(x.kitobId); }}>Kitobga o'tish</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div className="izohcha">
        Bildirishnoma ilova ochiq turganda ishlaydi. Kun bo'yi eslatish uchun kitob ichidagi
        «Kalendarga qo'shish» tugmasidan foydalaning.
      </div>
    </div>
  );
}

    </nav>
  );
}

/* ==================== Ilova ==================== */

function Ilova() {
  const [kitoblar, oKitoblar] = useState(null);
  const [barcha, oBarcha] = useState({});
  const [xato, oXato] = useState(null);
  const [joriy, oJoriy] = useState(null);
  const [turkum, oTurkum] = useState(null);
  const [tab, oTab] = useState('kitoblar');

  useEffect(function () { tgTayyor(); }, []);

  /* Ro'yxat, keyin fonda barcha kitoblar — jarayon va kundalik shundan hisoblanadi */
  useEffect(function () {
    let bekor = false;
    fetch('books/index.json', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        if (bekor) return;
        const ro = (d && d.kitoblar) || [];
        oKitoblar(ro);
        return Promise.all(ro.map(function (k) {
          return fetch('books/' + k.id + '.json', { cache: 'no-cache' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        })).then(function (natijalar) {
          if (bekor) return;
          const xarita = {};
          ro.forEach(function (k, i) { if (natijalar[i]) xarita[k.id] = natijalar[i]; });
          oBarcha(xarita);
        });
      })
      .catch(function (e) { if (!bekor) oXato(String(e.message || e)); });
    return function () { bekor = true; };
  }, []);

  /* Ortga: kitobdan turkumga, turkumdan bosh sahifaga */
  const orqaga = useCallback(function () {
    haptic('light');
    if (joriy) oJoriy(null);
    else oTurkum(null);
  }, [joriy]);

  const och = useCallback(function (id) {
    haptic('medium');
    yoz('km_oxirgi', id);
    oJoriy(id);
  }, []);

  /* Turkumdan tashqaridagi kitob ochilsa, turkum konteksti tozalanadi */
  const ochYakka = useCallback(function (id) {
    oTurkum(null);
    och(id);
  }, [och]);

  const turkumniOch = useCallback(function (nomi) {
    haptic('medium');
    oTurkum(nomi);
  }, []);

  /* Telegram BackButton — kitob va turkum ichida */
  const ichkarida = Boolean(joriy || turkum);
  useEffect(function () {
    return backButton(ichkarida, orqaga);
  }, [ichkarida, orqaga]);

  /* Brauzer "orqaga" tugmasi ham ishlasin */
  useEffect(function () {
    function popstate() { orqaga(); }
    if (ichkarida) {
      window.history.pushState({ ichkari: true }, '');
      window.addEventListener('popstate', popstate);
      return function () { window.removeEventListener('popstate', popstate); };
    }
  }, [ichkarida, orqaga]);

  useEffect(function () { window.scrollTo(0, 0); }, [tab, joriy, turkum]);

  const eslatmaSoni = mashqlarniYig(barcha, 'eslatma')
    .filter(function (x) { return x.qiymat && x.qiymat.yoniq; }).length;

  const joriyKitob = joriy && kitoblar
    ? kitoblar.filter(function (k) { return k.id === joriy; })[0]
    : null;

  function tabgaOt(id) {
    oJoriy(null);
    oTurkum(null);
    oTab(id);
  }

  /* Boshqa sahifalardan kitob ochilganda uning turkumiga qaytadigan bo'lsin */
  function qayerdanBolsa(id) {
    const k = (kitoblar || []).filter(function (x) { return x.id === id; })[0];
    oTurkum(k && k.turkum ? k.turkum : null);
    oTab('kitoblar');
    och(id);
  }

  let ichi;
  if (joriy) {
    ichi = <KitobSahifa id={joriy} orqaga={orqaga} rang={joriyKitob ? joriyKitob.rang : null} />;
  } else if (turkum) {
    ichi = <TurkumSahifa nomi={turkum} kitoblar={kitoblar} barcha={barcha} och={och} orqaga={orqaga} />;
  } else if (tab === 'jarayon') {
    ichi = <Jarayon kitoblar={kitoblar} barcha={barcha} och={qayerdanBolsa} orqaga={function () { tabgaOt('kitoblar'); }} />;
  } else if (tab === 'kundalik') {
    ichi = <KundalikSahifa barcha={barcha} och={qayerdanBolsa} orqaga={function () { tabgaOt('kitoblar'); }} />;
  } else if (tab === 'eslatma') {
    ichi = <EslatmaSahifa barcha={barcha} och={qayerdanBolsa} orqaga={function () { tabgaOt('kitoblar'); }} />;
  } else {
    ichi = (
      <Royxat
        kitoblar={kitoblar}
        barcha={barcha}
        xato={xato}
        och={ochYakka}
        turkumniOch={turkumniOch}
        tab={tabgaOt}
        eslatmaSoni={eslatmaSoni}
      />
    );
  }

  return (
    <React.Fragment>
      <div className="qobiq">{ichi}</div>
      <PastNav faol={joriy ? 'kitoblar' : tab} tanla={tabgaOt} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('ildiz')).render(<Ilova />);
</script>
