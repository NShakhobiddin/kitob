<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ==================== Telegram WebApp (xavfsiz o'ram) ==================== */
/* SDK bo'lmasa ham (oddiy brauzer) hech qanday xato bermaydi */

const TG = (function () {
  try {
    return window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  } catch (e) { return null; }
})();

/* CSS o'zgaruvchisini xavfsiz o'rnatish */
function uslubQoy(nom, qiymat) {
  try { document.documentElement.style.setProperty(nom, qiymat); } catch (e) {}
}

/* Xavfsiz hudud va oyna balandligini Telegramdan olib, CSS ga uzatadi.
   To'liq ekranda Telegram sarlavhasi yashiriladi va kontent status bar
   ostiga chiqadi — shuning uchun yuqori bo'shliq JS orqali beriladi. */
function olchamlarniYangila() {
  if (!TG) return;
  try {
    const kontent = TG.contentSafeAreaInset || {};
    const oyna = TG.safeAreaInset || {};
    const yuqori = (kontent.top || 0) + (oyna.top || 0);
    const past = (kontent.bottom || 0) + (oyna.bottom || 0);
    if (yuqori > 0) uslubQoy('--yuqori-xavfsiz', yuqori + 'px');
    if (past > 0) uslubQoy('--past-xavfsiz', past + 'px');
    const balandlik = TG.viewportStableHeight || TG.viewportHeight;
    if (balandlik) uslubQoy('--oyna-balandlik', balandlik + 'px');
  } catch (e) {}
}

function tgTayyor() {
  if (!TG) return;
  try {
    TG.ready();
    TG.expand();
    /* To'liq ekran — Bot API 8.0+; bo'lmasa expand() bilan cheklanadi */
    if (typeof TG.requestFullscreen === 'function') {
      try { TG.requestFullscreen(); } catch (e) {}
    }
    /* Pastga tortganda ilova yopilib qolmasin — scroll barqaror bo'ladi */
    if (typeof TG.disableVerticalSwipes === 'function') {
      try { TG.disableVerticalSwipes(); } catch (e) {}
    }
    if (TG.setHeaderColor) TG.setHeaderColor('#eef1f8');
    if (TG.setBackgroundColor) TG.setBackgroundColor('#eef1f8');
    if (TG.setBottomBarColor) { try { TG.setBottomBarColor('#eef1f8'); } catch (e) {} }

    olchamlarniYangila();
    ['viewportChanged', 'safeAreaChanged', 'contentSafeAreaChanged', 'fullscreenChanged']
      .forEach(function (hodisa) {
        try { TG.onEvent(hodisa, olchamlarniYangila); } catch (e) {}
      });
  } catch (e) {}
}

function haptic(tur) {
  if (!TG || !TG.HapticFeedback) return;
  try {
    if (tur === 'success' || tur === 'warning' || tur === 'error') {
      TG.HapticFeedback.notificationOccurred(tur);
    } else if (tur === 'select') {
      TG.HapticFeedback.selectionChanged();
    } else {
      TG.HapticFeedback.impactOccurred(tur || 'light');
    }
  } catch (e) {}
}

/* BackButton — kitob ichida ko'rsatiladi */
function backButton(korsat, ishlov) {
  if (!TG || !TG.BackButton) return function () {};
  try {
    if (!korsat) { TG.BackButton.hide(); return function () {}; }
    TG.BackButton.onClick(ishlov);
    TG.BackButton.show();
    return function () {
      try { TG.BackButton.offClick(ishlov); TG.BackButton.hide(); } catch (e) {}
    };
  } catch (e) { return function () {}; }
}

/* Hero foni: navy asos + kitob rangining nozik tusi.
   Shu bilan barcha kitob va turkum sahifalari bir xil ko'rinadi. */
function heroFon(rang) {
  const asos = 'linear-gradient(158deg, #2c4fb0, #152a63)';
  if (!rang) return asos;
  return 'radial-gradient(120% 90% at 20% 0%, ' + rang + '66, transparent 62%), ' + asos;
}

/* Hex rangni to'qlashtirish — muqova va hero gradienti uchun */
function qoraytir(hex, ulush) {
  try {
    const u = typeof ulush === 'number' ? ulush : .45;
    const t = String(hex).replace('#', '');
    const to = t.length === 3 ? t.split('').map(function (c) { return c + c; }).join('') : t;
    const n = parseInt(to, 16);
    const r = Math.round(((n >> 16) & 255) * (1 - u));
    const g = Math.round(((n >> 8) & 255) * (1 - u));
    const b = Math.round((n & 255) * (1 - u));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  } catch (e) { return '#152a63'; }
}

/* Telegram foydalanuvchisining ismi — bo'lmasa null */
function tgIsm() {
  try {
    const u = TG && TG.initDataUnsafe ? TG.initDataUnsafe.user : null;
    return u && u.first_name ? u.first_name : null;
  } catch (e) { return null; }
}

/* ==================== localStorage yordamchilari ==================== */

function kalit(kitobId, bolimIdx, mashqIdx) {
  return 'km_' + kitobId + '_' + bolimIdx + '_' + mashqIdx;
}

function oqi(k, standart) {
  try {
    const xom = window.localStorage.getItem(k);
    if (xom === null) return standart;
    return JSON.parse(xom);
  } catch (e) { return standart; }
}

/* Saqlash hodisasiga obuna — jarayon foizi jonli yangilanishi uchun */
const tinglovchilar = [];
let ogohSoat = null;

function ogohlantir() {
  if (ogohSoat) clearTimeout(ogohSoat);
  ogohSoat = setTimeout(function () {
    ogohSoat = null;
    tinglovchilar.slice().forEach(function (f) { try { f(); } catch (e) {} });
  }, 250);
}

function yoz(k, qiymat) {
  try { window.localStorage.setItem(k, JSON.stringify(qiymat)); ogohlantir(); return true; }
  catch (e) { return false; }
}

/* Har safar biror javob saqlanganda ortadigan hisoblagich */
function useSaqlashVersiya() {
  const [versiya, oVersiya] = useState(0);
  useEffect(function () {
    function ishlov() { oVersiya(function (v) { return v + 1; }); }
    tinglovchilar.push(ishlov);
    return function () {
      const i = tinglovchilar.indexOf(ishlov);
      if (i !== -1) tinglovchilar.splice(i, 1);
    };
  }, []);
  return versiya;
}

/* Saqlangan qiymatni komponent ichida boshqarish uchun umumiy hook */
function useSaqlash(k, standart) {
  const [qiymat, oQiymat] = useState(function () { return oqi(k, standart); });
  const [saqlandi, oSaqlandi] = useState(false);
  const soat = useRef(null);

  const yangila = useCallback(function (yangi) {
    oQiymat(yangi);
    yoz(k, yangi);
    oSaqlandi(true);
    if (soat.current) clearTimeout(soat.current);
    soat.current = setTimeout(function () { oSaqlandi(false); }, 1600);
  }, [k]);

  useEffect(function () {
    return function () { if (soat.current) clearTimeout(soat.current); };
  }, []);

  return [qiymat, yangila, saqlandi];
}

/* ==================== Amaliyot yadrosi ==================== */
/* Mashq — bir martalik javob emas, takrorlanadigan amaliyot.
   Har bir tur {kunlar: {'YYYY-MM-DD': ...}} shaklida tarix saqlaydi.
   Eski (bir martalik) qiymatlar o'qishda avtomatik ko'chiriladi. */

function bugunKalit() { return sanaKalit(new Date()); }

/* Eski shakldagi qiymatni yangi {kunlar:…} shakliga keltiradi */
function koch(turi, q) {
  const bosh = { kunlar: {} };
  if (q === null || q === undefined) return bosh;
  if (q && typeof q === 'object' && q.kunlar) return q;

  const kun = (q && q.oxirgi) || bugunKalit();
  switch (turi) {
    case 'jurnal':
      if (typeof q === 'string' && q.trim()) {
        return { kunlar: {}, yozuvlar: [{ sana: kun, qismlar: [q] }] };
      }
      return bosh;
    case 'checklist':
      if (Array.isArray(q)) { const k = {}; k[kun] = q; return { kunlar: k }; }
      return bosh;
    case 'slider':
      if (typeof q === 'number') { const k = {}; k[kun] = q; return { kunlar: k }; }
      return bosh;
    case 'sanagich':
      if (typeof q === 'number') { const k = {}; k[kun] = q; return { kunlar: k }; }
      return bosh;
    case 'taymer':
      if (q && q.marta) {
        const s = [];
        for (let i = 0; i < q.marta; i++) s.push({ sana: kun });
        return { kunlar: {}, seanslar: s };
      }
      return bosh;
    case 'test':
      if (typeof q === 'number') return { kunlar: {}, javoblar: [{ sana: kun, j: q }] };
      return bosh;
    default:
      return bosh;
  }
}

/* Tarixdagi kunlarni yangidan eskiga qarab qaytaradi */
function kunRoyxat(d) {
  return Object.keys((d && d.kunlar) || {}).sort().reverse();
}

/* Ketma-ket kunlar seriyasi — bugundan yoki kechadan orqaga */
function kunSeriya(sanalar) {
  const bor = {};
  sanalar.forEach(function (s) { bor[s] = true; });
  const kun = new Date();
  if (!bor[sanaKalit(kun)]) kun.setDate(kun.getDate() - 1);
  let n = 0;
  while (bor[sanaKalit(kun)]) { n++; kun.setDate(kun.getDate() - 1); }
  return n;
}

/* Oxirgi n kunning sana kalitlari, eskidan yangiga */
function oxirgiKunlar(n) {
  const r = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    r.push(sanaKalit(d));
  }
  return r;
}

/* Mashq umuman boshlanganmi — jarayon foizi shundan chiqadi (orqaga qaytmaydi) */
function mashqBajarilgan(m, xom) {
  const q = koch(m.turi, xom);
  switch (m.turi) {
    case 'jurnal': return ((q.yozuvlar || []).length > 0);
    case 'test': return ((q.javoblar || []).length > 0);
    case 'taymer': return ((q.seanslar || []).length > 0);
    case 'saralash': return Boolean(q.bandlar && q.bandlar.length);
    case 'juftlik': return Boolean(q.ustunlar && q.ustunlar.some(function (u) { return (u || []).length; }));
    case 'kundalik': return Array.isArray(xom) ? xom.length > 0 : ((q.yozuvlar || []).length > 0);
    case 'eslatma': return Boolean(xom && xom.yoniq);
    default: return kunRoyxat(q).length > 0;
  }
}

/* Bu mashq bugun bajarildimi — "Bugun" paneli shu asosda quriladi */
function mashqBugun(m, xom) {
  const q = koch(m.turi, xom);
  const b = bugunKalit();
  switch (m.turi) {
    case 'checklist': {
      const bugun = (q.kunlar || {})[b] || [];
      return (m.bandlar || []).length > 0 && bugun.length >= (m.bandlar || []).length;
    }
    case 'slider':
    case 'sanagich':
      return (q.kunlar || {})[b] !== undefined;
    case 'taymer':
      return (q.seanslar || []).some(function (s) { return s.sana === b; });
    case 'jurnal':
      return (q.yozuvlar || []).some(function (y) { return y.sana === b; });
    case 'kundalik':
      return (Array.isArray(xom) ? xom : []).some(function (y) { return y.sana === b; });
    case 'eslatma':
      return Boolean(xom && xom.yoniq);
    default:
      return mashqBajarilgan(m, xom);
  }
}

/* Har kuni takrorlanadigan turlar — "Bugun" panelida ko'rsatiladi */
const KUNLIK_TURLAR = { checklist: 1, slider: 1, sanagich: 1, taymer: 1, kundalik: 1 };

/* Kitob bo'yicha: jami mashq, bajarilgani va foizi */
function kitobHisob(kitob) {
  let jami = 0, bajarildi = 0;
  (kitob.bolimlar || []).forEach(function (b, bi) {
    (b.mashqlar || []).forEach(function (m, mi) {
      jami++;
      if (mashqBajarilgan(m, oqi(kalit(kitob.id, bi, mi), null))) bajarildi++;
    });
  });
  return { jami: jami, bajarildi: bajarildi, foiz: jami ? Math.round(bajarildi / jami * 100) : 0 };
}

/* Barcha kitoblardan berilgan turdagi mashqlarni yig'ish */
function mashqlarniYig(barcha, turi) {
  const natija = [];
  Object.keys(barcha || {}).forEach(function (id) {
    const kitob = barcha[id];
    if (!kitob) return;
    (kitob.bolimlar || []).forEach(function (b, bi) {
      (b.mashqlar || []).forEach(function (m, mi) {
        if (m.turi !== turi) return;
        natija.push({
          kitobId: id, kitobNomi: kitob.nomi, bolim: b.sarlavha,
          m: m, k: kalit(id, bi, mi), qiymat: oqi(kalit(id, bi, mi), null)
        });
      });
    });
  });
  return natija;
}

/* ==================== Mashqlar ==================== */

/* --- Sparkline: oxirgi kunlar qiymatlari --- */
function Chizmacha(props) {
  const nuqtalar = props.nuqtalar || [];
  const min = props.min, max = props.max;
  const bor = nuqtalar.filter(function (n) { return n.q !== undefined; });
  if (bor.length < 2) return null;
  const W = 100, H = 30, oraliq = Math.max(1, max - min);
  const qadam = nuqtalar.length > 1 ? W / (nuqtalar.length - 1) : W;
  let d = '', oldingi = null;
  nuqtalar.forEach(function (n, i) {
    if (n.q === undefined) return;
    const x = i * qadam;
    const y = H - ((n.q - min) / oraliq) * (H - 4) - 2;
    d += (oldingi === null ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    oldingi = i;
  });
  const oxirgi = bor[bor.length - 1];
  const ox = nuqtalar.indexOf(oxirgi) * qadam;
  const oy = H - ((oxirgi.q - min) / oraliq) * (H - 4) - 2;
  return (
    <svg className="chizmacha" viewBox={'0 0 ' + W + ' ' + H} preserveAspectRatio="none">
      <path d={d.trim()} />
      <circle cx={ox} cy={oy} r="2.6" />
    </svg>
  );
}

/* --- Kunlik panjara: oxirgi 7 kun --- */
function Panjara(props) {
  const kunlar = props.kunlar || [];
  return (
    <div className="panjara">
      {kunlar.map(function (x, i) {
        const t = x.ulush;
        const daraja = t >= 1 ? 'toliq' : (t > 0 ? 'qisman' : 'bosh');
        return (
          <div key={i} className={'panjara-kun ' + daraja} title={x.sana}>
            <span>{Number(String(x.sana).split('-')[2])}</span>
          </div>
        );
      })}
    </div>
  );
}

/* --- Jurnal: bosqichli savollar + sanali yozuvlar --- */
/* Bir savolga bir marta emas, vaqti-vaqti bilan qaytib yozish uchun */
function Jurnal(props) {
  const m = props.m;
  const qadamlar = (m.qadamlar && m.qadamlar.length) ? m.qadamlar : null;
  const nechta = qadamlar ? qadamlar.length : 1;
  const [dala, yangila, saqlandi] = useSaqlash(props.k, null);
  const d = koch('jurnal', dala);
  const yozuvlar = d.yozuvlar || [];
  const bugun = bugunKalit();
  const bugungi = yozuvlar.filter(function (y) { return y.sana === bugun; })[0] || null;

  const [qoralama, oQoralama] = useState(function () {
    return (bugungi && bugungi.qismlar) ? bugungi.qismlar.slice() : new Array(nechta).fill('');
  });
  const [ochiq, oOchiq] = useState(false);

  function ozgar(i, v) {
    const y = qoralama.slice();
    y[i] = v;
    oQoralama(y);
  }

  function saqla() {
    const toza = qoralama.map(function (s) { return (s || '').trim(); });
    if (!toza.some(Boolean)) return;
    haptic('success');
    const qolgan = yozuvlar.filter(function (y) { return y.sana !== bugun; });
    yangila({ kunlar: d.kunlar || {}, yozuvlar: [{ sana: bugun, qismlar: toza }].concat(qolgan) });
  }

  function ochir(sana) {
    haptic('warning');
    yangila({ kunlar: d.kunlar || {}, yozuvlar: yozuvlar.filter(function (y) { return y.sana !== sana; }) });
  }

  const eskilar = yozuvlar.filter(function (y) { return y.sana !== bugun; });
  const sozlar = qoralama.join(' ').trim().split(/\s+/).filter(Boolean).length;
  const ozgargan = !bugungi || JSON.stringify(bugungi.qismlar) !== JSON.stringify(qoralama.map(function (s) { return (s || '').trim(); }));

  return (
    <div className="mashq">
      <span className="mashq-turi">✍️ Yozuv</span>
      <div className="mashq-savol">{m.savol}</div>

      {qadamlar ? qadamlar.map(function (q, i) {
        return (
          <div key={i} className="qadam">
            <div className="qadam-bosh"><span className="qadam-raqam">{i + 1}</span>{q}</div>
            <textarea
              className="past"
              value={qoralama[i] || ''}
              placeholder="Javobingiz…"
              onChange={function (e) { ozgar(i, e.target.value); }}
            />
          </div>
        );
      }) : (
        <textarea
          value={qoralama[0] || ''}
          placeholder="Bu yerga yozing…"
          onChange={function (e) { ozgar(0, e.target.value); }}
        />
      )}

      <div className="tugmalar chapga">
        <button className="tug asosiy" onClick={saqla} disabled={!sozlar || !ozgargan}>
          {bugungi ? 'Bugungi yozuvni yangilash' : 'Bugungi yozuv sifatida saqlash'}
        </button>
        {eskilar.length ? (
          <button className="tug jim" onClick={function () { haptic('select'); oOchiq(!ochiq); }}>
            {eskilar.length} ta eski yozuv {ochiq ? '▲' : '▼'}
          </button>
        ) : null}
      </div>

      {ochiq ? (
        <div className="tarix">
          {eskilar.map(function (y) {
            return (
              <div key={y.sana} className="tarix-yozuv">
                <div className="tarix-bosh">
                  <span className="yozuv-sana">{sanaChirey(y.sana)}</span>
                  <button className="mayda-tug" onClick={function () { ochir(y.sana); }}>o'chirish</button>
                </div>
                {(y.qismlar || []).map(function (s, i) {
                  return s ? <p key={i}>{qadamlar ? (i + 1) + '. ' : ''}{s}</p> : null;
                })}
              </div>
            );
          })}
        </div>
      ) : null}

      <div className={'holat' + (saqlandi ? ' saqlandi' : '')}>
        {saqlandi ? '✓ Saqlandi'
          : (yozuvlar.length
            ? yozuvlar.length + ' ta yozuv · oxirgisi ' + sanaChirey(yozuvlar[0].sana)
            : 'Shu savolga vaqti-vaqti bilan qaytib yozing — yozuvlar sana bilan saqlanadi')}
      </div>
    </div>
  );
}

/* --- Checklist: har kuni qaytariladigan ro'yxat + 7 kunlik panjara --- */
function Checklist(props) {
  const bandlar = props.m.bandlar || [];
  const [dala, yangila] = useSaqlash(props.k, null);
  const d = koch('checklist', dala);
  const bugun = bugunKalit();
  const bugungi = (d.kunlar || {})[bugun] || [];

  function almashtir(i) {
    haptic('select');
    const yangi = bugungi.indexOf(i) === -1
      ? bugungi.concat([i])
      : bugungi.filter(function (x) { return x !== i; });
    const kunlar = Object.assign({}, d.kunlar);
    if (yangi.length) kunlar[bugun] = yangi; else delete kunlar[bugun];
    yangila({ kunlar: kunlar });
    if (yangi.length === bandlar.length && bandlar.length > 0) haptic('success');
  }

  const foiz = bandlar.length ? Math.round(bugungi.length / bandlar.length * 100) : 0;
  const toliqKunlar = kunRoyxat(d).filter(function (s) {
    return (d.kunlar[s] || []).length >= bandlar.length;
  });
  const ketma = kunSeriya(toliqKunlar);
  const panjara = oxirgiKunlar(7).map(function (s) {
    const n = ((d.kunlar || {})[s] || []).length;
    return { sana: s, ulush: bandlar.length ? n / bandlar.length : 0 };
  });

  return (
    <div className="mashq">
      <span className="mashq-turi">☑️ Kunlik ro'yxat</span>
      {props.m.sarlavha ? <div className="mashq-savol">{props.m.sarlavha}</div> : null}
      <div>
        {bandlar.map(function (band, i) {
          const bor = bugungi.indexOf(i) !== -1;
          return (
            <div
              key={i}
              className={'band' + (bor ? ' belgili' : '')}
              role="checkbox"
              aria-checked={bor}
              tabIndex={0}
              onClick={function () { almashtir(i); }}
              onKeyDown={function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); almashtir(i); } }}
            >
              <span className="quti">{bor ? '✓' : ''}</span>
              <span className="yorliq">{band}</span>
            </div>
          );
        })}
      </div>
      <div className="progress-chiziq"><i style={{ width: foiz + '%' }} /></div>
      <Panjara kunlar={panjara} />
      <div className="holat">
        Bugun {bugungi.length} / {bandlar.length}
        {ketma ? ' · ' + ketma + ' kun ketma-ket to‘liq' : ' · ro‘yxat har kuni yangilanadi'}
      </div>
    </div>
  );
}

/* --- O'lchov: kunlik qiymat + 14 kunlik chizmacha --- */
function Slider(props) {
  const min = typeof props.m.min === 'number' ? props.m.min : 1;
  const max = typeof props.m.max === 'number' ? props.m.max : 10;
  const [dala, yangila, saqlandi] = useSaqlash(props.k, null);
  const d = koch('slider', dala);
  const bugun = bugunKalit();
  const bugungi = (d.kunlar || {})[bugun];
  const [qoralama, oQoralama] = useState(function () {
    if (bugungi !== undefined) return bugungi;
    const kunlar = kunRoyxat(d);
    return kunlar.length ? d.kunlar[kunlar[0]] : Math.round((min + max) / 2);
  });

  function belgila(v) {
    oQoralama(v);
    const kunlar = Object.assign({}, d.kunlar);
    kunlar[bugun] = v;
    yangila({ kunlar: kunlar });
  }

  const tarixKunlari = kunRoyxat(d);
  const oldingiSana = tarixKunlari.filter(function (s) { return s !== bugun; })[0];
  const oldingi = oldingiSana !== undefined ? d.kunlar[oldingiSana] : null;
  const qiymatlar = tarixKunlari.map(function (s) { return d.kunlar[s]; });
  const ortacha = qiymatlar.length
    ? Math.round(qiymatlar.reduce(function (a, b) { return a + b; }, 0) / qiymatlar.length * 10) / 10 : null;
  const nuqtalar = oxirgiKunlar(14).map(function (s) { return { sana: s, q: (d.kunlar || {})[s] }; });
  const farq = (bugungi !== undefined && oldingi !== null) ? bugungi - oldingi : null;

  return (
    <div className="mashq">
      <span className="mashq-turi">🎚 O'lchov</span>
      <div className="mashq-savol">{props.m.savol}</div>
      <div className="slider-qiymat">
        {qoralama}
        {farq ? <span className={'farq ' + (farq > 0 ? 'osdi' : 'tushdi')}>{farq > 0 ? '▲' : '▼'}{Math.abs(farq)}</span> : null}
      </div>
      <input
        type="range"
        min={min}
        max={max}
        step={1}
        value={qoralama}
        onChange={function (e) { belgila(Number(e.target.value)); }}
        onMouseUp={function () { haptic('light'); }}
        onTouchEnd={function () { haptic('light'); }}
      />
      <div className="yorliqlar">
        <span>{props.m.min_yorliq || min}</span>
        <span>{props.m.max_yorliq || max}</span>
      </div>
      <Chizmacha nuqtalar={nuqtalar} min={min} max={max} />
      <div className={'holat' + (saqlandi ? ' saqlandi' : '')}>
        {tarixKunlari.length > 1
          ? tarixKunlari.length + ' kunlik o‘lchov · o‘rtacha ' + ortacha
          : (bugungi !== undefined ? '✓ Bugungi qiymat yozildi' : 'Har kuni bir marta belgilang — chizmacha o‘zi chiziladi')}
      </div>
    </div>
  );
}

/* --- Sanagich: kun davomida necha marta sodir bo'ldi --- */
function Sanagich(props) {
  const [dala, yangila] = useSaqlash(props.k, null);
  const d = koch('sanagich', dala);
  const bugun = bugunKalit();
  const n = (d.kunlar || {})[bugun] || 0;

  function ozgart(qadam) {
    const yangi = Math.max(0, n + qadam);
    haptic(qadam > 0 ? 'light' : 'select');
    const kunlar = Object.assign({}, d.kunlar);
    if (yangi) kunlar[bugun] = yangi; else delete kunlar[bugun];
    yangila({ kunlar: kunlar });
  }

  const hafta = oxirgiKunlar(7).map(function (s) { return { sana: s, q: (d.kunlar || {})[s] || 0 }; });
  const eng = Math.max(1, Math.max.apply(null, hafta.map(function (x) { return x.q; })));
  const kunlar = kunRoyxat(d);
  const jami = kunlar.reduce(function (a, s) { return a + d.kunlar[s]; }, 0);

  return (
    <div className="mashq">
      <span className="mashq-turi">🔢 Sanagich</span>
      <div className="mashq-savol">{props.m.savol}</div>
      {props.m.korsatma ? <div className="izohcha-matn">{props.m.korsatma}</div> : null}
      <div className="sanagich-orin">
        <button className="dumaloq-tug sanoq-kam" onClick={function () { ozgart(-1); }} disabled={!n} aria-label="Kamaytirish">−</button>
        <div className="sanoq-son">{n}</div>
        <button className="dumaloq-tug sanoq-kop" onClick={function () { ozgart(1); }} aria-label="Qo'shish">+</button>
      </div>
      <div className="ustunchalar">
        {hafta.map(function (x, i) {
          return (
            <div key={i} className="ustuncha" title={x.sana + ': ' + x.q}>
              <i style={{ height: Math.round(x.q / eng * 100) + '%' }} />
              <span>{Number(String(x.sana).split('-')[2])}</span>
            </div>
          );
        })}
      </div>
      <div className="holat">
        {kunlar.length ? kunlar.length + ' kunda jami ' + jami + ' marta' : 'Har safar sezganingizda bosing'}
      </div>
    </div>
  );
}

/* --- Taymer: aylana progress + boshlash/pauza/qayta --- */
function Taymer(props) {
  const jami = Math.max(1, Math.round((props.m.daqiqa || 5) * 60));
  const [qolgan, oQolgan] = useState(jami);
  const [ketmoqda, oKetmoqda] = useState(false);
  const [tugadi, oTugadi] = useState(false);
  const [natija, yangilaNatija] = useSaqlash(props.k, null);
  const d = koch('taymer', natija);
  const seanslar = d.seanslar || [];
  const marta = seanslar.length;
  /* Seansdan oldingi holat — tugagach "keyin" bilan solishtiriladi */
  const [oldin, oOldin] = useState(null);
  const [soraldi, oSoraldi] = useState(false);

  /* Tugaganda seansni yozadi; oldin/keyin bahosi keyin qo'shiladi */
  const belgilaTugadi = useCallback(function () {
    const eski = koch('taymer', oqi(props.k, null));
    const yangiSeans = { sana: sanaKalit(new Date()), daqiqa: props.m.daqiqa || 5 };
    yangilaNatija({ kunlar: eski.kunlar || {}, seanslar: [yangiSeans].concat(eski.seanslar || []) });
    oSoraldi(true);
  }, [props.k, yangilaNatija, props.m.daqiqa]);

  /* Seans tugagach keyingi holatni yozadi */
  function baho(keyin) {
    haptic('success');
    const eski = koch('taymer', oqi(props.k, null));
    const s = (eski.seanslar || []).slice();
    if (s.length) s[0] = Object.assign({}, s[0], { oldin: oldin, keyin: keyin });
    yangilaNatija({ kunlar: eski.kunlar || {}, seanslar: s });
    oSoraldi(false);
  }

  useEffect(function () {
    if (!ketmoqda) return;
    const id = setInterval(function () {
      oQolgan(function (avvalgi) {
        if (avvalgi <= 1) {
          clearInterval(id);
          oKetmoqda(false);
          oTugadi(true);
          haptic('success');
          belgilaTugadi();
          return 0;
        }
        return avvalgi - 1;
      });
    }, 1000);
    return function () { clearInterval(id); };
  }, [ketmoqda, belgilaTugadi]);

  function boshla() {
    haptic('medium');
    if (tugadi) { oQolgan(jami); oTugadi(false); oSoraldi(false); }
    oKetmoqda(!ketmoqda);
  }
  function qayta() {
    haptic('light');
    oKetmoqda(false); oTugadi(false); oQolgan(jami); oSoraldi(false);
  }

  const daq = Math.floor(qolgan / 60);
  const son = qolgan % 60;
  const R = 60;
  const uzunlik = 2 * Math.PI * R;
  const ulush = qolgan / jami;
  const boshlanmagan = qolgan === jami && !ketmoqda && !tugadi;

  /* Oldin/keyin juftligi bo'lgan seanslar bo'yicha o'rtacha siljish */
  const juftlar = seanslar.filter(function (s) { return typeof s.oldin === 'number' && typeof s.keyin === 'number'; });
  const siljish = juftlar.length
    ? Math.round(juftlar.reduce(function (a, s) { return a + (s.keyin - s.oldin); }, 0) / juftlar.length * 10) / 10
    : null;
  const jamiDaqiqa = seanslar.reduce(function (a, s) { return a + (s.daqiqa || 0); }, 0);
  const seriyaKun = kunSeriya(seanslar.map(function (s) { return s.sana; }));

  return (
    <div className="mashq">
      <span className="mashq-turi">⏳ Seans</span>
      {props.m.korsatma ? <div className="mashq-savol">{props.m.korsatma}</div> : null}

      {boshlanmagan ? (
        <div className="baho-qator">
          <span className="baho-yorliq">Boshlashdan oldin holatingiz</span>
          <div className="baho-tugmalar">
            {[1, 2, 3, 4, 5].map(function (v) {
              return (
                <button
                  key={v}
                  className={'baho-tug' + (oldin === v * 2 ? ' tanlangan' : '')}
                  onClick={function () { haptic('select'); oOldin(v * 2); }}
                >{v * 2}</button>
              );
            })}
          </div>
        </div>
      ) : null}

      <div className="taymer-orin">
        <div className="halqa">
          <svg width="132" height="132" viewBox="0 0 132 132">
            <circle className="iz" cx="66" cy="66" r={R} />
            <circle
              className="yoy" cx="66" cy="66" r={R}
              strokeDasharray={uzunlik}
              strokeDashoffset={uzunlik * (1 - ulush)}
            />
          </svg>
          <div className="vaqt">{daq}:{son < 10 ? '0' + son : son}</div>
        </div>
        <div className="tugmalar">
          <button className="tug asosiy" onClick={boshla}>
            {tugadi ? 'Qaytadan' : (ketmoqda ? 'Pauza' : (qolgan === jami ? 'Boshlash' : 'Davom ettirish'))}
          </button>
          <button className="tug jim" onClick={qayta}>Qayta</button>
        </div>

        {soraldi ? (
          <div className="baho-qator toliq">
            <span className="baho-yorliq">Seansdan keyin holatingiz</span>
            <div className="baho-tugmalar">
              {[1, 2, 3, 4, 5].map(function (v) {
                return (
                  <button key={v} className="baho-tug" onClick={function () { baho(v * 2); }}>{v * 2}</button>
                );
              })}
            </div>
          </div>
        ) : (tugadi ? <div className="izoh" style={{ width: '100%' }}>🌙 Seans yozildi.</div> : null)}
      </div>

      <div className="holat">
        {marta
          ? marta + ' seans · ' + jamiDaqiqa + ' daqiqa'
            + (seriyaKun > 1 ? ' · ' + seriyaKun + ' kun ketma-ket' : '')
            + (siljish !== null ? ' · o‘rtacha siljish ' + (siljish > 0 ? '+' : '') + siljish : '')
          : 'Boshlashdan oldin holatingizni belgilang — tugagach farqi ko‘rinadi'}
      </div>
    </div>
  );
}

/* --- Savol: variant tanlanganda izoh; javoblar tarixi saqlanadi --- */
function Test(props) {
  const variantlar = props.m.variantlar || [];
  const izohlar = props.m.izohlar || [];
  const [dala, yangila] = useSaqlash(props.k, null);
  const d = koch('test', dala);
  const javoblar = d.javoblar || [];
  const tanlov = javoblar.length ? javoblar[0].j : null;
  const harflar = 'ABCDEFGH';

  function tanla(i) {
    haptic('select');
    const bugun = bugunKalit();
    if (tanlov === i) {
      yangila({ kunlar: d.kunlar || {}, javoblar: javoblar.slice(1) });
      return;
    }
    /* Shu kunda qayta tanlansa yozuv almashadi, boshqa kunda yangi qatlam qo'shiladi */
    const qolgan = (javoblar[0] && javoblar[0].sana === bugun) ? javoblar.slice(1) : javoblar;
    yangila({ kunlar: d.kunlar || {}, javoblar: [{ sana: bugun, j: i }].concat(qolgan) });
  }

  const eskilar = javoblar.slice(1);
  const ozgargan = eskilar.length && eskilar[0].j !== tanlov;

  return (
    <div className="mashq">
      <span className="mashq-turi">🔮 Savol</span>
      <div className="mashq-savol">{props.m.savol}</div>
      {variantlar.map(function (v, i) {
        return (
          <button
            key={i}
            className={'variant' + (tanlov === i ? ' tanlangan' : '')}
            onClick={function () { tanla(i); }}
          >
            <span className="harf">{harflar[i] || (i + 1)}</span>{v}
          </button>
        );
      })}
      {tanlov !== null && izohlar[tanlov] ? <div className="izoh">{izohlar[tanlov]}</div> : null}
      <div className="holat">
        {ozgargan
          ? 'Fikringiz o‘zgardi: ' + sanaChirey(eskilar[0].sana) + ' kuni ' + (harflar[eskilar[0].j] || '?') + ' variantini tanlagansiz'
          : (eskilar.length
            ? 'Bu savolga ' + javoblar.length + ' marta javob bergansiz'
            : 'To‘g‘ri yoki noto‘g‘ri javob yo‘q — bu o‘zingizni anglash uchun')}
      </div>
    </div>
  );
}

/* --- Saralash: ro'yxat tuzib, uni bosqichma-bosqich siqish --- */
/* Zelandning 20→5→3 va Norbekovning maqsad mashqi shu shaklda ishlaydi */
function Saralash(props) {
  const bosqichlar = props.m.bosqichlar || [];
  const [dala, yangila] = useSaqlash(props.k, null);
  const d = koch('saralash', dala);
  const bandlar = d.bandlar || [];
  const tanlov = d.tanlov || {};
  const [matn, oMatn] = useState('');
  const [bosqich, oBosqich] = useState(0);

  function saqla(y) { yangila(Object.assign({ kunlar: d.kunlar || {} }, y)); }

  function qosh() {
    const t = matn.trim();
    if (!t) return;
    haptic('light');
    saqla({ bandlar: bandlar.concat([t]), tanlov: tanlov });
    oMatn('');
  }

  function ochir(i) {
    haptic('warning');
    const yangiTanlov = {};
    Object.keys(tanlov).forEach(function (b) {
      yangiTanlov[b] = tanlov[b].filter(function (x) { return x !== i; })
        .map(function (x) { return x > i ? x - 1 : x; });
    });
    saqla({ bandlar: bandlar.filter(function (_, j) { return j !== i; }), tanlov: yangiTanlov });
  }

  /* Bosqichda tanlanadigan bandlar — oldingi bosqich natijasidan */
  function manba(b) {
    if (b === 0) return bandlar.map(function (_, i) { return i; });
    return tanlov[b - 1] || [];
  }

  function almashtir(b, i) {
    const joriy = tanlov[b] || [];
    const chek = (bosqichlar[b] && bosqichlar[b].soni) || 0;
    let yangi;
    if (joriy.indexOf(i) !== -1) yangi = joriy.filter(function (x) { return x !== i; });
    else {
      if (chek && joriy.length >= chek) { haptic('warning'); return; }
      yangi = joriy.concat([i]);
    }
    haptic('select');
    const t = Object.assign({}, tanlov);
    t[b] = yangi;
    /* Keyingi bosqichlardan chiqib qolganlarni tozalaydi */
    for (let n = b + 1; n < bosqichlar.length; n++) {
      t[n] = (t[n] || []).filter(function (x) { return yangi.indexOf(x) !== -1; });
    }
    saqla({ bandlar: bandlar, tanlov: t });
  }

  const joriyBosqich = bosqichlar[bosqich] || null;
  const korinadi = bosqich === 0 ? bandlar.map(function (_, i) { return i; }) : manba(bosqich);
  const tanlangan = tanlov[bosqich] || [];
  const chek = (joriyBosqich && joriyBosqich.soni) || 0;
  const oxirgiBosqich = bosqichlar.length - 1;
  const natija = (tanlov[oxirgiBosqich] || []).map(function (i) { return bandlar[i]; }).filter(Boolean);

  return (
    <div className="mashq">
      <span className="mashq-turi">🎯 Saralash</span>
      <div className="mashq-savol">{props.m.savol}</div>

      <div className="bosqich-tanlov">
        {bosqichlar.map(function (b, i) {
          const ochiq = i === 0 || (tanlov[i - 1] || []).length > 0;
          return (
            <button
              key={i}
              className={'bosqich-tug' + (i === bosqich ? ' faol' : '') + (ochiq ? '' : ' yopiq')}
              onClick={function () { if (ochiq) { haptic('select'); oBosqich(i); } }}
              disabled={!ochiq}
            >
              {b.nomi}
              {b.soni ? <span className="bosqich-son">{(tanlov[i] || []).length}/{b.soni}</span> : null}
            </button>
          );
        })}
      </div>

      {joriyBosqich && joriyBosqich.izoh ? <div className="izohcha-matn">{joriyBosqich.izoh}</div> : null}

      {bosqich === 0 ? (
        <div className="qator-kiritish">
          <input
            type="text"
            value={matn}
            placeholder={props.m.joy_matn || 'Yangi band…'}
            onChange={function (e) { oMatn(e.target.value); }}
            onKeyDown={function (e) { if (e.key === 'Enter') { e.preventDefault(); qosh(); } }}
          />
          <button className="tug asosiy" onClick={qosh} disabled={!matn.trim()}>Qo'shish</button>
        </div>
      ) : null}

      <div className="saralash-royxat">
        {korinadi.length === 0 ? (
          <div className="bosh-holat">
            {bosqich === 0 ? 'Hozircha bo‘sh — yuqoridan band qo‘shing' : 'Avvalgi bosqichda tanlov qiling'}
          </div>
        ) : korinadi.map(function (i) {
          const bor = tanlangan.indexOf(i) !== -1;
          return (
            <div key={i} className={'saralash-band' + (bor ? ' tanlangan' : '')}>
              <button
                className="saralash-matn"
                onClick={function () { if (bosqich > 0 || chek) almashtir(bosqich, i); }}
              >
                <span className="quti">{bor ? '✓' : ''}</span>
                <span className="yorliq">{bandlar[i]}</span>
              </button>
              {bosqich === 0 ? (
                <button className="mayda-tug" onClick={function () { ochir(i); }} aria-label="O'chirish">✕</button>
              ) : null}
            </div>
          );
        })}
      </div>

      {natija.length ? (
        <div className="natija-quti">
          <div className="natija-bosh">{bosqichlar[oxirgiBosqich].nomi}</div>
          {natija.map(function (t, i) { return <p key={i}>{i + 1}. {t}</p>; })}
        </div>
      ) : null}

      <div className="holat">
        {bandlar.length
          ? bandlar.length + ' band · ' + (chek ? 'shu bosqichda ' + tanlangan.length + '/' + chek + ' tanlandi' : 'ro‘yxatni to‘ldiring')
          : 'Avval ro‘yxatni to‘ldiring, keyin uni bosqichma-bosqich siqasiz'}
      </div>
    </div>
  );
}

/* --- Juftlik: ikki yoki uch ustunni yonma-yon to'ldirish --- */
function Juftlik(props) {
  const ustunlar = props.m.ustunlar || [];
  const [dala, yangila] = useSaqlash(props.k, null);
  const d = koch('juftlik', dala);
  const qiymat = d.ustunlar || ustunlar.map(function () { return []; });
  const [faol, oFaol] = useState(0);
  const [matn, oMatn] = useState('');

  function saqla(u) { yangila({ kunlar: d.kunlar || {}, ustunlar: u }); }

  function qosh() {
    const t = matn.trim();
    if (!t) return;
    haptic('light');
    const u = qiymat.map(function (x) { return (x || []).slice(); });
    while (u.length < ustunlar.length) u.push([]);
    u[faol] = u[faol].concat([t]);
    saqla(u);
    oMatn('');
  }

  function ochir(ui, i) {
    haptic('warning');
    const u = qiymat.map(function (x) { return (x || []).slice(); });
    u[ui] = u[ui].filter(function (_, j) { return j !== i; });
    saqla(u);
  }

  const jami = qiymat.reduce(function (a, x) { return a + (x || []).length; }, 0);

  return (
    <div className="mashq">
      <span className="mashq-turi">⚖️ Taqqoslash</span>
      <div className="mashq-savol">{props.m.savol}</div>

      <div className="bosqich-tanlov">
        {ustunlar.map(function (u, i) {
          return (
            <button
              key={i}
              className={'bosqich-tug' + (i === faol ? ' faol' : '')}
              onClick={function () { haptic('select'); oFaol(i); }}
            >
              {u.sarlavha}
              <span className="bosqich-son">{(qiymat[i] || []).length}</span>
            </button>
          );
        })}
      </div>

      {ustunlar[faol] && ustunlar[faol].izoh ? <div className="izohcha-matn">{ustunlar[faol].izoh}</div> : null}

      <div className="qator-kiritish">
        <input
          type="text"
          value={matn}
          placeholder={(ustunlar[faol] && ustunlar[faol].joy_matn) || 'Yangi band…'}
          onChange={function (e) { oMatn(e.target.value); }}
          onKeyDown={function (e) { if (e.key === 'Enter') { e.preventDefault(); qosh(); } }}
        />
        <button className="tug asosiy" onClick={qosh} disabled={!matn.trim()}>Qo'shish</button>
      </div>

      <div className="ustunlar-orin">
        {ustunlar.map(function (u, ui) {
          const bandlar = qiymat[ui] || [];
          return (
            <div key={ui} className={'ustun-quti' + (ui === faol ? ' faol' : '')}>
              <div className="ustun-bosh">{u.sarlavha}</div>
              {bandlar.length === 0 ? <div className="bosh-holat">—</div> : bandlar.map(function (t, i) {
                return (
                  <div key={i} className="ustun-band">
                    <span>{t}</span>
                    <button className="mayda-tug" onClick={function () { ochir(ui, i); }} aria-label="O'chirish">✕</button>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>

      <div className="holat">
        {jami ? 'Jami ' + jami + ' band · ustunlarni solishtiring' : 'Har bir ustunni to‘ldiring, keyin ularni yonma-yon o‘qing'}
      </div>
    </div>
  );
}

/* --- Sana yordamchilari --- */
const OYLAR = ['yanv', 'fev', 'mart', 'apr', 'may', 'iyun', 'iyul', 'avg', 'sent', 'okt', 'noy', 'dek'];

function ikki(n) { return n < 10 ? '0' + n : String(n); }

function sanaKalit(d) {
  return d.getFullYear() + '-' + ikki(d.getMonth() + 1) + '-' + ikki(d.getDate());
}

function sanaChirey(kalitMatn) {
  const q = String(kalitMatn || '').split('-');
  if (q.length !== 3) return kalitMatn || '';
  return Number(q[2]) + ' ' + (OYLAR[Number(q[1]) - 1] || '') ;
}

/* Ketma-ket kunlar seriyasi: bugundan (yoki kechadan) orqaga sanaladi */
function seriya(sanalar) {
  const bor = {};
  sanalar.forEach(function (s) { bor[s] = true; });
  const kun = new Date();
  if (!bor[sanaKalit(kun)]) kun.setDate(kun.getDate() - 1);
  let n = 0;
  while (bor[sanaKalit(kun)]) { n++; kun.setDate(kun.getDate() - 1); }
  return n;
}

/* --- Kundalik: sanali yozuvlar + belgilar chastotasi --- */
function Kundalik(props) {
  const [yozuvlar, yangila, saqlandi] = useSaqlash(props.k, []);
  const royxat = Array.isArray(yozuvlar) ? yozuvlar : [];
  const [matn, oMatn] = useState('');
  const [belgi, oBelgi] = useState('');
  const [ochiq, oOchiq] = useState(null);

  function qosh() {
    const tan = matn.trim();
    if (!tan) return;
    haptic('success');
    const bel = belgi.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    const hozir = new Date();
    yangila([{
      sana: sanaKalit(hozir),
      vaqt: ikki(hozir.getHours()) + ':' + ikki(hozir.getMinutes()),
      matn: tan,
      belgilar: bel
    }].concat(royxat));
    oMatn(''); oBelgi(''); oOchiq(null);
  }

  function ochir(i) {
    haptic('warning');
    yangila(royxat.filter(function (_, j) { return j !== i; }));
    oOchiq(null);
  }

  /* Takrorlanuvchi belgilar — "tush belgilari"ni shu yerdan topasiz */
  const hisob = {};
  royxat.forEach(function (y) {
    (y.belgilar || []).forEach(function (b) {
      const n = b.toLowerCase();
      hisob[n] = (hisob[n] || 0) + 1;
    });
  });
  const tez = Object.keys(hisob)
    .sort(function (a, b) { return hisob[b] - hisob[a]; })
    .slice(0, 8);

  const kunlar = seriya(royxat.map(function (y) { return y.sana; }));

  return (
    <div className="mashq">
      <span className="mashq-turi">🌙 Kundalik</span>
      {props.m.sarlavha ? <div className="mashq-savol">{props.m.sarlavha}</div> : null}
      {props.m.korsatma ? <div className="izoh" style={{ marginBottom: 12 }}>{props.m.korsatma}</div> : null}

      <textarea
        value={matn}
        placeholder={props.m.joy_matn || 'Eslaganingizni yozing — parcha bo‘lsa ham…'}
        onChange={function (e) { oMatn(e.target.value); }}
      />
      <input
        type="text"
        value={belgi}
        placeholder={props.m.belgi_matn || 'Belgilar, vergul bilan: suv, maktab, uchish'}
        onChange={function (e) { oBelgi(e.target.value); }}
      />
      <div className="tugmalar" style={{ justifyContent: 'flex-start', marginTop: 10 }}>
        <button className="tug asosiy" onClick={qosh} disabled={!matn.trim()}>Yozuvni saqlash</button>
      </div>

      {tez.length ? (
        <div style={{ marginTop: 14 }}>
          <div className="holat">Takrorlanayotgan belgilar — ehtimoliy tush belgilaringiz:</div>
          <div className="nishonlar">
            {tez.map(function (b) {
              return <span key={b} className="nishon">{b}<b>{hisob[b]}</b></span>;
            })}
          </div>
        </div>
      ) : null}

      {royxat.length ? (
        <div style={{ marginTop: 14 }}>
          {royxat.map(function (y, i) {
            return (
              <div key={i} className="yozuv">
                <button
                  className="yozuv-bosh"
                  onClick={function () { haptic('select'); oOchiq(ochiq === i ? null : i); }}
                  aria-expanded={ochiq === i}
                >
                  <span className="yozuv-sana">{sanaChirey(y.sana)}{y.vaqt ? ' · ' + y.vaqt : ''}</span>
                  <span className="yozuv-qisqa">{y.matn}</span>
                  <span className="yozuv-strelka">{ochiq === i ? '▲' : '▼'}</span>
                </button>
                {ochiq === i ? (
                  <div className="yozuv-tan">
                    {y.matn}
                    {(y.belgilar || []).length ? (
                      <div className="nishonlar">
                        {y.belgilar.map(function (b, j) { return <span key={j} className="nishon">{b}</span>; })}
                      </div>
                    ) : null}
                    <div className="tugmalar" style={{ justifyContent: 'flex-start', marginTop: 10 }}>
                      <button className="tug jim" onClick={function () { ochir(i); }}>O'chirish</button>
                    </div>
                  </div>
                ) : null}
              </div>
            );
          })}
        </div>
      ) : null}

      <div className={'holat' + (saqlandi ? ' saqlandi' : '')}>
        {saqlandi
          ? '✓ Saqlandi'
          : (royxat.length
              ? royxat.length + ' ta yozuv' + (kunlar > 1 ? ' · ketma-ket ' + kunlar + ' kun' : '')
              : 'Hali yozuv yo‘q. Eng qisqa parcha ham hisoblanadi.')}
      </div>
    </div>
  );
}

/* --- Eslatma: bildirishnoma + kalendarga eksport --- */
function bildirishnomaHolati() {
  try {
    if (typeof window.Notification === 'undefined') return 'yoq';
    return window.Notification.permission;
  } catch (e) { return 'yoq'; }
}

function Eslatma(props) {
  const standart = {
    yoniq: false,
    vaqtlar: Array.isArray(props.m.vaqtlar) && props.m.vaqtlar.length
      ? props.m.vaqtlar
      : ['09:00', '13:00', '17:00', '21:00']
  };
  const [holat, yangila] = useSaqlash(props.k, standart);
  const h = (holat && typeof holat === 'object') ? holat : standart;
  const vaqtlar = Array.isArray(h.vaqtlar) ? h.vaqtlar : standart.vaqtlar;

  const [ruxsat, oRuxsat] = useState(bildirishnomaHolati);
  const [yangi, oYangi] = useState('12:00');
  const [xabar, oXabar] = useState(null);
  const oxirgi = useRef('');

  const sarlavha = props.m.sarlavha || 'Eslatma';
  const matn = props.m.matn || 'Reallik tekshiruvi vaqti keldi.';

  /* Ilova ochiq turganda vaqtni kuzatib boradi */
  useEffect(function () {
    if (!h.yoniq || !vaqtlar.length) return;
    function tekshir() {
      const d = new Date();
      const hozir = ikki(d.getHours()) + ':' + ikki(d.getMinutes());
      if (vaqtlar.indexOf(hozir) === -1) return;
      const belgi = sanaKalit(d) + ' ' + hozir;
      if (oxirgi.current === belgi) return;
      oxirgi.current = belgi;
      haptic('warning');
      oXabar(matn);
      try {
        if (typeof window.Notification !== 'undefined' && window.Notification.permission === 'granted') {
          new window.Notification(sarlavha, { body: matn });
        }
      } catch (e) { /* bildirishnoma yo'q bo'lsa ham ilova ishlayveradi */ }
    }
    tekshir();
    const id = setInterval(tekshir, 15000);
    return function () { clearInterval(id); };
  }, [h.yoniq, vaqtlar.join(','), sarlavha, matn]);

  function almashtir() {
    haptic('medium');
    const keyingi = !h.yoniq;
    yangila({ yoniq: keyingi, vaqtlar: vaqtlar });
    if (keyingi) soraRuxsat();
    else oXabar(null);
  }

  function soraRuxsat() {
    try {
      if (typeof window.Notification === 'undefined') return;
      if (window.Notification.permission === 'default') {
        window.Notification.requestPermission().then(function (r) { oRuxsat(r); });
      } else {
        oRuxsat(window.Notification.permission);
      }
    } catch (e) { oRuxsat('yoq'); }
  }

  function vaqtQosh() {
    if (!yangi || vaqtlar.indexOf(yangi) !== -1) return;
    haptic('select');
    const r = vaqtlar.concat([yangi]).sort();
    yangila({ yoniq: h.yoniq, vaqtlar: r });
  }

  function vaqtOchir(v) {
    haptic('light');
    yangila({ yoniq: h.yoniq, vaqtlar: vaqtlar.filter(function (x) { return x !== v; }) });
  }

  /* Telefon kalendariga har kuni takrorlanuvchi eslatma sifatida yuklab olish */
  function kalendarga() {
    haptic('medium');
    const d = new Date();
    const bugun = String(d.getFullYear()) + ikki(d.getMonth() + 1) + ikki(d.getDate());
    const qismlar = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Kitob Magzi//UZ//', 'CALSCALE:GREGORIAN'
    ];
    vaqtlar.forEach(function (v, i) {
      const soat = v.replace(':', '') + '00';
      qismlar.push(
        'BEGIN:VEVENT',
        'UID:' + props.k + '-' + i + '-' + bugun + '@kitob-magzi',
        'DTSTAMP:' + bugun + 'T000000Z',
        'DTSTART:' + bugun + 'T' + soat,
        'DURATION:PT5M',
        'RRULE:FREQ=DAILY',
        'SUMMARY:' + sarlavha,
        'DESCRIPTION:' + matn.replace(/\n/g, ' '),
        'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY',
        'DESCRIPTION:' + sarlavha, 'END:VALARM',
        'END:VEVENT'
      );
    });
    qismlar.push('END:VCALENDAR');
    try {
      const blob = new Blob([qismlar.join('\r\n')], { type: 'text/calendar' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'eslatma.ics';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    } catch (e) {
      oXabar('Bu yerda faylni yuklab bo‘lmadi. Ilovani brauzerda oching yoki vaqtlarni telefon eslatmasiga qo‘lda kiriting.');
    }
  }

  /* Keyingi eslatmagacha qancha qolgani */
  function keyingiVaqt() {
    if (!vaqtlar.length) return null;
    const d = new Date();
    const hozir = d.getHours() * 60 + d.getMinutes();
    let eng = null;
    vaqtlar.forEach(function (v) {
      const q = v.split(':');
      let daq = Number(q[0]) * 60 + Number(q[1]) - hozir;
      if (daq <= 0) daq += 24 * 60;
      if (eng === null || daq < eng) eng = daq;
    });
    if (eng === null) return null;
    const s = Math.floor(eng / 60);
    return s ? s + ' soat ' + (eng % 60) + ' daqiqa' : eng + ' daqiqa';
  }

  const qoldi = h.yoniq ? keyingiVaqt() : null;

  return (
    <div className="mashq">
      <span className="mashq-turi">🔔 Eslatma</span>
      <div className="mashq-savol">{sarlavha}</div>
      {props.m.korsatma ? <div className="izoh" style={{ marginBottom: 12 }}>{props.m.korsatma}</div> : null}

      <button className={'kalit-tugma' + (h.yoniq ? ' yoniq' : '')} onClick={almashtir} aria-pressed={h.yoniq}>
        <span className="kalit-yugurt" />
        <span>{h.yoniq ? 'Eslatma yoqilgan' : 'Eslatmani yoqish'}</span>
      </button>

      <div className="qatorlar">
        {vaqtlar.map(function (v) {
          return (
            <span key={v} className={'vaqt-nishon' + (h.yoniq ? '' : ' ochiq-holat')}>
              {v}
              <button onClick={function () { vaqtOchir(v); }} aria-label={v + ' ni o‘chirish'}>×</button>
            </span>
          );
        })}
      </div>

      <div className="qatorlar" style={{ marginTop: 10 }}>
        <input type="time" value={yangi} onChange={function (e) { oYangi(e.target.value); }} />
        <button className="tug" onClick={vaqtQosh}>Vaqt qo'shish</button>
        <button className="tug jim" onClick={kalendarga}>Kalendarga qo'shish</button>
      </div>

      {ruxsat === 'denied' && h.yoniq ? (
        <div className="holat">Bildirishnomaga ruxsat berilmagan — eslatma ilova ichida ko‘rinadi.</div>
      ) : null}
      {ruxsat === 'default' && h.yoniq ? (
        <div className="tugmalar" style={{ justifyContent: 'flex-start', marginTop: 10 }}>
          <button className="tug" onClick={soraRuxsat}>Bildirishnomaga ruxsat berish</button>
        </div>
      ) : null}

      {xabar ? <div className="izoh" style={{ marginTop: 12 }}>🔔 {xabar}</div> : null}

      <div className="holat">
        {h.yoniq
          ? (qoldi ? 'Keyingi eslatma ' + qoldi + 'dan keyin' : 'Vaqt qo‘shing')
          : 'Vaqtlar shu qurilmada saqlanadi'}
      </div>
      <div className="holat">
        Bildirishnoma ilova ochiq turganda ishlaydi. Kun bo‘yi eslatib turishi uchun
        «Kalendarga qo‘shish» tugmasi orqali telefon kalendariga o‘tkazing.
      </div>
    </div>
  );
}

/* --- Mashq turini tanlovchi --- */
/* Ketma-ket mashqlar ikki xil ottenkada beriladi va tartib raqami ko'rsatiladi */
function Mashq(props) {
  const m = props.m;
  const i = props.mashqIdx;
  const k = kalit(props.kitobId, props.bolimIdx, i);
  const bajarildi = mashqBajarilgan(m, oqi(k, null));

  let ichi = null;
  if (m.turi === 'jurnal') ichi = <Jurnal m={m} k={k} />;
  else if (m.turi === 'checklist') ichi = <Checklist m={m} k={k} />;
  else if (m.turi === 'slider') ichi = <Slider m={m} k={k} />;
  else if (m.turi === 'sanagich') ichi = <Sanagich m={m} k={k} />;
  else if (m.turi === 'taymer') ichi = <Taymer m={m} k={k} />;
  else if (m.turi === 'test') ichi = <Test m={m} k={k} />;
  else if (m.turi === 'saralash') ichi = <Saralash m={m} k={k} />;
  else if (m.turi === 'juftlik') ichi = <Juftlik m={m} k={k} />;
  else if (m.turi === 'kundalik') ichi = <Kundalik m={m} k={k} />;
  else if (m.turi === 'eslatma') ichi = <Eslatma m={m} k={k} />;
  if (!ichi) return null;

  return (
    <div className={'mashq-orin' + (i % 2 ? ' ottenka-b' : ' ottenka-a') + (bajarildi ? ' bajarildi' : '')}>
      <div className="mashq-raqam">{bajarildi ? '✓' : i + 1}</div>
      {ichi}
    </div>
  );
}

/* ==================== Bo'lim (akkordeon) ==================== */

function Bolim(props) {
  const b = props.b;
  const magiz = b.magiz || [];
  const tavsiyalar = b.tavsiyalar || [];
  const mashqlar = b.mashqlar || [];
  /* Ikki bo'limcha: ma'nosi alohida, mashqlar alohida */
  const [bolimcha, oBolimcha] = useState('magiz');
  const orin = useRef(null);
  const birinchi = useRef(true);

  const bajarildi = mashqlar.filter(function (m, i) {
    return mashqBajarilgan(m, oqi(kalit(props.kitobId, props.idx, i), null));
  }).length;

  /* Bo'lim sarlavhasini ekran tepasiga olib chiqadi — yopishqoq panel hisobga olinadi */
  const tepaga = useCallback(function (silliq) {
    const el = orin.current;
    if (!el) return;
    const panel = document.querySelector('.panel');
    const past = panel ? panel.getBoundingClientRect().height : 0;
    const y = (window.scrollY || 0) + el.getBoundingClientRect().top - past - 8;
    try {
      window.scrollTo({ top: Math.max(0, y), behavior: silliq ? 'smooth' : 'auto' });
    } catch (e) { window.scrollTo(0, Math.max(0, y)); }
  }, []);

  /* Bo'lim ochilganda uning boshiga suriladi (sahifa yuklanishida emas) */
  useEffect(function () {
    if (birinchi.current) { birinchi.current = false; return; }
    if (!props.ochiq) return;
    if (props.boshlangich) oBolimcha(props.boshlangich);
    const id = requestAnimationFrame(function () { tepaga(true); });
    return function () { cancelAnimationFrame(id); };
  }, [props.ochiq, props.boshlangich, tepaga]);

  function tanla(qaysi) {
    if (qaysi === bolimcha) return;
    haptic('select');
    oBolimcha(qaysi);
    /* Bo'limcha almashganda ham boshidan ko'rsatiladi */
    requestAnimationFrame(function () { tepaga(true); });
  }

  return (
    <section
      ref={orin}
      className={'bolim' + (props.ochiq ? ' ochiq' : '') + (props.idx % 2 ? ' ottenka-b' : ' ottenka-a')}
    >
      <button className="bolim-tugma" onClick={props.almashtir} aria-expanded={props.ochiq}>
        <span className="raqam">{props.idx + 1}</span>
        <div style={{ flex: 1, minWidth: 0 }}>
          <h4>{b.sarlavha}</h4>
          {mashqlar.length ? (
            <div className="kichik">{bajarildi} / {mashqlar.length} mashq bajarilgan</div>
          ) : null}
        </div>
        <span className="strelka">▼</span>
      </button>

      {props.ochiq ? (
        <div className="bolim-ich">
          <div className="bolimcha-tanlov" role="tablist">
            <button
              className={'bolimcha-tug' + (bolimcha === 'magiz' ? ' faol' : '')}
              onClick={function () { tanla('magiz'); }}
              role="tab" aria-selected={bolimcha === 'magiz'}
            >💠 Ma'nosi</button>
            <button
              className={'bolimcha-tug' + (bolimcha === 'mashq' ? ' faol' : '')}
              onClick={function () { tanla('mashq'); }}
              role="tab" aria-selected={bolimcha === 'mashq'}
            >
              🌙 Mashqlar
              {mashqlar.length ? <span className="son">{mashqlar.length}</span> : null}
            </button>
          </div>

          {bolimcha === 'magiz' ? (
            <div className="bolimcha-ich">
              {magiz.length ? (
                <div className="qism">
                  <div className="qism-sarlavha">💠 Ma'nosi</div>
                  <ul className="magiz">
                    {magiz.map(function (t, i) { return <li key={i}>{t}</li>; })}
                  </ul>
                </div>
              ) : null}

              {tavsiyalar.length ? (
                <div className="qism">
                  <div className="qism-sarlavha">🔑 Amaliy tavsiyalar</div>
                  <ol className="tavsiyalar">
                    {tavsiyalar.map(function (t, i) { return <li key={i}>{t}</li>; })}
                  </ol>
                </div>
              ) : null}

              {mashqlar.length ? (

/* --- «Bugun» paneli: har kuni qaytariladigan amaliyotlar --- */
/* Kitob sahifasining tepasida turadi va bugun nima qolganini ko'rsatadi */
function BugunPaneli(props) {
  const YORLIQ = {
    checklist: 'Kunlik ro\'yxat', slider: 'O\'lchov', sanagich: 'Sanagich',
    taymer: 'Seans', kundalik: 'Kundalik'
  };
  const royxat = [];
  (props.bolimlar || []).forEach(function (b, bi) {
    (b.mashqlar || []).forEach(function (m, mi) {
      if (!KUNLIK_TURLAR[m.turi]) return;
      const xom = oqi(kalit(props.kitobId, bi, mi), null);
      royxat.push({
        bi: bi, nomi: m.savol || m.sarlavha || m.korsatma || '',
        turi: m.turi, bolim: b.sarlavha,
        tayyor: mashqBugun(m, xom)
      });
    });
  });
  if (!royxat.length) return null;

  const qolgan = royxat.filter(function (x) { return !x.tayyor; });
  const korinadi = (qolgan.length ? qolgan : royxat).slice(0, 4);

  return (
    <div className="bugun-quti">
      <div className="bugun-bosh">
        Bugungi amaliyot · {royxat.length - qolgan.length}/{royxat.length}
      </div>
      {korinadi.map(function (x, i) {
        return (
          <button
            key={i}
            className={'bugun-qator' + (x.tayyor ? ' tayyor' : '')}
            onClick={function () { haptic('select'); props.och(x.bi); }}
          >
            <span className="bugun-nishon">{x.tayyor ? '✓' : (i + 1)}</span>
            <span className="bugun-matn">
              {x.nomi.length > 68 ? x.nomi.slice(0, 68) + '…' : x.nomi}
              <small>{YORLIQ[x.turi]} · {x.bolim}</small>
            </span>
          </button>
        );
      })}
      {qolgan.length === 0
        ? <div className="bugun-bosh" style={{ marginTop: 8, marginBottom: 0 }}>Bugungi amaliyot to'liq bajarildi</div>
        : (qolgan.length > 4 ? <div className="bugun-bosh" style={{ marginTop: 8, marginBottom: 0 }}>yana {qolgan.length - 4} ta</div> : null)}
    </div>
  );
}

/* ==================== Kitoblar ro'yxati (bosh sahifa) ==================== */

/* Kitoblarni "turkum" maydoni bo'yicha guruhlaydi; turkumsizlari oxirida */
const TURKUMSIZ = 'Boshqa kitoblar';

function turkumlarga(kitoblar, oxirgi) {
  const tartib = [];
  const xarita = {};
  kitoblar.forEach(function (k) {
    const nomi = k.turkum || TURKUMSIZ;
    if (!xarita[nomi]) { xarita[nomi] = []; tartib.push(nomi); }
    xarita[nomi].push(k);
  });
  tartib.sort(function (a, b) {
    return (a === TURKUMSIZ ? 1 : 0) - (b === TURKUMSIZ ? 1 : 0);
  });
  return tartib.map(function (nomi) {
    /* Oxirgi ochilgan kitob o'z turkumi boshida turadi */
    const ro = xarita[nomi].slice().sort(function (a, b) {
      return (b.id === oxirgi ? 1 : 0) - (a.id === oxirgi ? 1 : 0);
    });
    return { nomi: nomi, kitoblar: ro };
  });
}

/* Bir nechta kitobning umumiy jarayoni */
function guruhHisob(kitoblar, barcha) {
  let jami = 0, bajarildi = 0;
  (kitoblar || []).forEach(function (k) {
    const kitob = barcha ? barcha[k.id] : null;
    if (!kitob) return;
    const h = kitobHisob(kitob);
    jami += h.jami; bajarildi += h.bajarildi;
  });
  return { jami: jami, bajarildi: bajarildi, foiz: jami ? Math.round(bajarildi / jami * 100) : 0 };
}

            className={'qator-karta' + (k.id === oxirgi ? ' joriy' : '')}
            onClick={function () { props.och(k.id); }}
          >
            <Muqova manba={k.muqova} rang={rang} olcham="qator" kichik />
            <div className="qator-matn">
              <h4 style={{ whiteSpace: 'normal' }}>{k.nomi}</h4>
              <p>{k.tavsif}</p>
              <div className="qator" style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 8 }}>
                <div className="progress-chiziq"><i style={{ width: h.foiz + '%' }} /></div>
                <span className="foiz" style={{ fontSize: 11, color: 'var(--matn-xira)' }}>{h.foiz}%</span>
              </div>
            </div>
          </button>
        );
      })}

      <div className="izohcha">Turkumdagi barcha kitoblar bitta joyda</div>
    </div>
  );
}

/* ==================== Jarayon sahifasi ==================== */

function Jarayon(props) {
  const kitoblar = props.kitoblar || [];
  const barcha = props.barcha || {};

  let jami = 0, bajarildi = 0;
  const qatorlar = kitoblar.map(function (k) {
    const kitob = barcha[k.id];
    const h = kitob ? kitobHisob(kitob) : { jami: 0, bajarildi: 0, foiz: 0 };
    jami += h.jami; bajarildi += h.bajarildi;
    return { k: k, h: h };
  });

  /* Kundalik yozuvlari va ketma-ket kunlar — barcha kitoblar bo'ylab */
  const yozuvlar = [];
  mashqlarniYig(barcha, 'kundalik').forEach(function (x) {
    if (Array.isArray(x.qiymat)) x.qiymat.forEach(function (y) { yozuvlar.push(y); });
  });
  const kunlar = seriya(yozuvlar.map(function (y) { return y.sana; }));

  return (
    <div>
      <Bosh
        nomi="Jarayon"
        chap={<button className="dumaloq-tug" onClick={props.orqaga} aria-label="Ortga"><Ikonka nom="chap" olcham={18} /></button>}
      />

      <div className="stat-panel">
        <div className="stat-quti"><b>{bajarildi}</b><span>Bajarilgan</span></div>
        <div className="stat-quti"><b>{jami ? Math.round(bajarildi / jami * 100) : 0}%</b><span>Umumiy</span></div>
        <div className="stat-quti"><b>{kunlar}</b><span>Ketma-ket kun</span></div>
      </div>

      {qatorlar.length === 0 ? (
        <div>
          <div className="skelet satr-skelet" />
          <div className="skelet qator-skelet" />
          <div className="skelet qator-skelet" />
          <div className="skelet qator-skelet" />
        </div>
      ) : turkumlarga(kitoblar).map(function (guruh) {
        let gJami = 0, gBajarildi = 0;
        guruh.kitoblar.forEach(function (k) {
          const kitob = barcha[k.id];
          if (!kitob) return;
          const h = kitobHisob(kitob);
          gJami += h.jami; gBajarildi += h.bajarildi;
        });
        return (
          <div key={guruh.nomi}>
            <BoshQator nomi={guruh.nomi} ong={gBajarildi + ' / ' + gJami + ' mashq'} />
            {guruh.kitoblar.map(function (k) {
              const kitob = barcha[k.id];
              const h = kitob ? kitobHisob(kitob) : { jami: 0, bajarildi: 0, foiz: 0 };
              const rang = k.rang || '#1e3a8a';
              return (
                <button key={k.id} className="qator-karta" onClick={function () { props.och(k.id); }}>
                  <Muqova manba={k.muqova} rang={rang} olcham="qator" kichik />
                  <div className="qator-matn">
                    <h4>{k.nomi}</h4>
                    <p>{h.bajarildi} / {h.jami} mashq</p>
                    <div className="progress-chiziq" style={{ marginTop: 8 }}>
                      <i style={{ width: h.foiz + '%' }} />
                    </div>
                  </div>
                  <span className="qator-son">{h.foiz}%</span>
                </button>
              );
            })}
          </div>
        );
      })}

      <div className="izohcha">Foiz saqlangan javoblardan hisoblanadi</div>
    </div>
  );
}

/* ==================== Kundalik sahifasi ==================== */

function KundalikSahifa(props) {
  const [qidiruv, oQidiruv] = useState('');
  const barcha = props.barcha || {};

  const hammasi = [];
  mashqlarniYig(barcha, 'kundalik').forEach(function (x) {
    if (!Array.isArray(x.qiymat)) return;
    x.qiymat.forEach(function (y) {
      hammasi.push({
        sana: y.sana, vaqt: y.vaqt, matn: y.matn, belgilar: y.belgilar || [],
        kitobId: x.kitobId, kitobNomi: x.kitobNomi, mashqNomi: x.m.sarlavha || 'Kundalik'
      });
    });
  });
  mashqlarniYig(barcha, 'jurnal').forEach(function (x) {
    if (typeof x.qiymat === 'string' && x.qiymat.trim()) {
      hammasi.push({
        sana: null, vaqt: null, matn: x.qiymat, belgilar: [],
        kitobId: x.kitobId, kitobNomi: x.kitobNomi, mashqNomi: 'Jurnal — ' + x.bolim
      });
    }
  });
  hammasi.sort(function (a, b) { return String(b.sana || '').localeCompare(String(a.sana || '')); });

  const sorov = qidiruv.trim().toLowerCase();
  const koringan = sorov
    ? hammasi.filter(function (y) {
        return (y.matn + ' ' + y.belgilar.join(' ') + ' ' + y.kitobNomi).toLowerCase().indexOf(sorov) !== -1;
      })
    : hammasi;

  const kunlar = seriya(hammasi.map(function (y) { return y.sana; }).filter(Boolean));

  return (
    <div>
      <Bosh
        nomi="Kundalik"
        chap={<button className="dumaloq-tug" onClick={props.orqaga} aria-label="Ortga"><Ikonka nom="chap" olcham={18} /></button>}
      />

      <div className="stat-panel">
        <div className="stat-quti"><b>{hammasi.length}</b><span>Yozuv</span></div>
        <div className="stat-quti"><b>{kunlar}</b><span>Ketma-ket kun</span></div>
        <div className="stat-quti"><b>{Object.keys(barcha).length}</b><span>Kitob</span></div>
      </div>

      <Qidiruv qiymat={qidiruv} oQiymat={oQidiruv} joy="Yozuvlar ichidan qidirish" />

      {hammasi.length === 0 ? (
        <div className="xabar">
          <span className="belgi"><Ikonka nom="qalam" olcham={26} /></span>
          Hali yozuv yo'q.<br />
          <small>Kitoblardagi kundalik va jurnal mashqlariga yozganlaringiz shu yerda to'planadi.</small>
        </div>
      ) : koringan.length === 0 ? (
        <div className="xabar"><span className="belgi">☾</span>Bunday yozuv topilmadi.</div>
      ) : (
        koringan.map(function (y, i) {
          return (
            <button key={i} className="qator-karta" onClick={function () { props.och(y.kitobId); }}>
              <div className="qator-nishon"><Ikonka nom={y.sana ? 'kitob' : 'qalam'} /></div>
              <div className="qator-matn">
                <h4>{y.sana ? sanaChirey(y.sana) + (y.vaqt ? ' · ' + y.vaqt : '') : y.mashqNomi}</h4>
                <p style={{ color: '#1e3a8a', fontWeight: 500 }}>{y.kitobNomi}</p>
                <p style={{ whiteSpace: 'normal', marginTop: 3 }}>{y.matn.length > 90 ? y.matn.slice(0, 90) + '…' : y.matn}</p>
                {y.belgilar.length ? (
                  <div className="nishonlar">
                    {y.belgilar.map(function (b, j) { return <span key={j} className="nishon">{b}</span>; })}
                  </div>
                ) : null}
              </div>
            </button>
          );
        })
      )}
    </div>
  );
}

/* ==================== Eslatmalar sahifasi ==================== */

function EslatmaSahifa(props) {
  const barcha = props.barcha || {};
  const [belgi, oBelgi] = useState(0);
  const royxat = mashqlarniYig(barcha, 'eslatma');

  function almashtir(x) {
    haptic('medium');
    const eski = oqi(x.k, null);
    const vaqtlar = (eski && eski.vaqtlar) || x.m.vaqtlar || [];
    yoz(x.k, { yoniq: !(eski && eski.yoniq), vaqtlar: vaqtlar });
    oBelgi(belgi + 1);
  }

  const yoniq = royxat.filter(function (x) { return x.qiymat && x.qiymat.yoniq; });

  return (
    <div>
      <Bosh
        nomi="Eslatmalar"
        chap={<button className="dumaloq-tug" onClick={props.orqaga} aria-label="Ortga"><Ikonka nom="chap" olcham={18} /></button>}
      />

      <div className="stat-panel">
        <div className="stat-quti"><b>{yoniq.length}</b><span>Yoqilgan</span></div>
        <div className="stat-quti"><b>{royxat.length}</b><span>Jami</span></div>
        <div className="stat-quti">
          <b>{yoniq.reduce(function (n, x) { return n + ((x.qiymat && x.qiymat.vaqtlar) || []).length; }, 0)}</b>
          <span>Kunlik signal</span>
        </div>
      </div>

      {royxat.length === 0 ? (
        <div className="xabar">
          <span className="belgi"><Ikonka nom="qongiroq" olcham={26} /></span>
          Eslatmali mashq topilmadi.
        </div>
      ) : (
        <div>
          <BoshQator nomi="Barcha eslatmalar" />
          {royxat.map(function (x, i) {
            const yoq = Boolean(x.qiymat && x.qiymat.yoniq);
            const vaqtlar = (x.qiymat && x.qiymat.vaqtlar) || x.m.vaqtlar || [];
            return (
              <div key={i} className="qator-karta jim" style={{ alignItems: 'flex-start' }}>
                <div className="qator-nishon" style={yoq ? { background: '#1e3a8a', color: '#fff' } : null}><Ikonka nom="qongiroq" /></div>
                <div className="qator-matn">
                  <h4>{x.m.sarlavha || 'Eslatma'}</h4>
                  <p>{x.kitobNomi}</p>
                  <div className="nishonlar">
                    {vaqtlar.map(function (v) { return <span key={v} className="nishon">{v}</span>; })}
                  </div>
                  <div className="tugmalar" style={{ justifyContent: 'flex-start', marginTop: 10 }}>
                    <button className={'tug' + (yoq ? '' : ' asosiy')} onClick={function () { almashtir(x); }}>
                      {yoq ? "O'chirish" : 'Yoqish'}
                    </button>
                    <button className="tug jim" onClick={function () { props.och(x.kitobId); }}>Kitobga o'tish</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div className="izohcha">
        Bildirishnoma ilova ochiq turganda ishlaydi. Kun bo'yi eslatish uchun kitob ichidagi
        «Kalendarga qo'shish» tugmasidan foydalaning.
      </div>
    </div>
  );
}

/* ==================== Pastki navigatsiya ==================== */

const NAV = [
  { id: 'kitoblar', belgi: 'uy', nomi: 'Kitoblar' },
  { id: 'jarayon', belgi: 'jarayon', nomi: 'Jarayon' },
  { id: 'kundalik', belgi: 'qalam', nomi: 'Kundalik' },
  { id: 'eslatma', belgi: 'qongiroq', nomi: 'Eslatma' }
];

function PastNav(props) {
  return (
    <nav className="past-nav">
      <div className="past-nav-ich">
        {NAV.map(function (n) {
          return (
            <button
              key={n.id}
              className={'nav-tug' + (props.faol === n.id ? ' faol' : '')}
              onClick={function () { haptic('select'); props.tanla(n.id); }}
              aria-current={props.faol === n.id}
            >
              <span className="nav-belgi"><Ikonka nom={n.belgi} /></span>
              {n.nomi}
            </button>
          );
        })}
      </div>
    </nav>
  );
}

/* ==================== Ilova ==================== */

function Ilova() {
  const [kitoblar, oKitoblar] = useState(null);
  const [turkumlar, oTurkumlar] = useState([]);
  const [barcha, oBarcha] = useState({});
  const [xato, oXato] = useState(null);
  const [joriy, oJoriy] = useState(null);
  /* Oxirgi holat tiklanadi — ilova ochilganda qayerda edingiz, o'sha yerda */
  const [turkum, oTurkum] = useState(function () { return oqi('km_turkum', null); });
  const [tab, oTab] = useState(function () {
    const t = oqi('km_tab', 'kitoblar');
    return NAV.some(function (n) { return n.id === t; }) ? t : 'kitoblar';
  });
  const [urinish, oUrinish] = useState(0);
  const surilma = useRef({});

  useEffect(function () { tgTayyor(); }, []);

  useEffect(function () { yoz('km_tab', tab); }, [tab]);
  useEffect(function () { yoz('km_turkum', turkum); }, [turkum]);

  /* Ro'yxat, keyin fonda barcha kitoblar — jarayon va kundalik shundan hisoblanadi */
  useEffect(function () {
    let bekor = false;
    oXato(null);
    fetch('books/index.json', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        if (bekor) return;
        const ro = (d && d.kitoblar) || [];
        oTurkumlar((d && d.turkumlar) || []);
        oKitoblar(ro);
        return Promise.all(ro.map(function (k) {
          return fetch('books/' + k.id + '.json', { cache: 'no-cache' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        })).then(function (natijalar) {
          if (bekor) return;
          const xarita = {};
          ro.forEach(function (k, i) { if (natijalar[i]) xarita[k.id] = natijalar[i]; });
          oBarcha(xarita);
        });
      })
      .catch(function (e) { if (!bekor) oXato(String(e.message || e)); });
    return function () { bekor = true; };
  }, [urinish]);

  /* Ortga: kitobdan turkumga, turkumdan bosh sahifaga */
  const orqaga = useCallback(function () {
    haptic('light');
    if (joriy) oJoriy(null);
    else oTurkum(null);
  }, [joriy]);

  const och = useCallback(function (id) {
    haptic('medium');
    yoz('km_oxirgi', id);
    oJoriy(id);
  }, []);

  /* Turkumdan tashqaridagi kitob ochilsa, turkum konteksti tozalanadi */
  const ochYakka = useCallback(function (id) {
    oTurkum(null);
    och(id);
  }, [och]);

  const turkumniOch = useCallback(function (nomi) {
    haptic('medium');
    oTurkum(nomi);
  }, []);

  /* Telegram BackButton — kitob va turkum ichida */
  const ichkarida = Boolean(joriy || turkum);
  useEffect(function () {
    return backButton(ichkarida, orqaga);
  }, [ichkarida, orqaga]);

  /* Brauzer "orqaga" tugmasi ham ishlasin */
  useEffect(function () {
    function popstate() { orqaga(); }
    if (ichkarida) {
      window.history.pushState({ ichkari: true }, '');
      window.addEventListener('popstate', popstate);
      return function () { window.removeEventListener('popstate', popstate); };
    }
  }, [ichkarida, orqaga]);

  /* Har bir ko'rinishning surilma holati saqlanadi va qaytganda tiklanadi */
  const korinish = joriy ? 'k:' + joriy : (turkum ? 't:' + turkum : 'tab:' + tab);
  useEffect(function () {
    const saqlangan = surilma.current[korinish] || 0;
    let tiklandi = false;      /* tiklash tugadimi */
    let foydalanuvchi = false; /* foydalanuvchi o'zi surdimi */

    function tikla() {
      if (foydalanuvchi) return;
      window.scrollTo(0, saqlangan);
    }
    /* Ikki kadr: kontent (rasmlar, akkordeon) joylashib bo'lgach ham to'g'ri tursin */
    const id1 = requestAnimationFrame(function () {
      tikla();
      const id2 = requestAnimationFrame(function () { tikla(); tiklandi = true; });
      surilma.current['__raf'] = id2;
    });

    function kuzat() {
      /* Tiklash tugagach har qanday surilish — foydalanuvchiniki */
      if (tiklandi) foydalanuvchi = true;
      surilma.current[korinish] = window.scrollY || 0;
    }
    window.addEventListener('scroll', kuzat, { passive: true });
    function qolTegdi() { foydalanuvchi = true; }
    window.addEventListener('wheel', qolTegdi, { passive: true });
    window.addEventListener('touchstart', qolTegdi, { passive: true });

    return function () {
      surilma.current[korinish] = window.scrollY || 0;
      cancelAnimationFrame(id1);
      if (surilma.current['__raf']) cancelAnimationFrame(surilma.current['__raf']);
      window.removeEventListener('scroll', kuzat);
      window.removeEventListener('wheel', qolTegdi);
      window.removeEventListener('touchstart', qolTegdi);
    };
  }, [korinish]);

  function turkumMuqova(nomi) {
    const t = turkumlar.filter(function (x) { return x.nomi === nomi; })[0];
    return t ? t.muqova : null;
  }

  const eslatmaSoni = mashqlarniYig(barcha, 'eslatma')
    .filter(function (x) { return x.qiymat && x.qiymat.yoniq; }).length;

  const joriyKitob = joriy && kitoblar
    ? kitoblar.filter(function (k) { return k.id === joriy; })[0]
    : null;

  function tabgaOt(id) {
    oJoriy(null);
    oTurkum(null);
    oTab(id);
  }

  /* Boshqa sahifalardan kitob ochilganda uning turkumiga qaytadigan bo'lsin */
  function qayerdanBolsa(id) {
    const k = (kitoblar || []).filter(function (x) { return x.id === id; })[0];
    oTurkum(k && k.turkum ? k.turkum : null);
    oTab('kitoblar');
    och(id);
  }

  let ichi;
  if (joriy) {
    ichi = (
      <KitobSahifa
        id={joriy}
        kitob={barcha[joriy] || null}
        orqaga={orqaga}
        rang={joriyKitob ? joriyKitob.rang : null}
        muqova={joriyKitob ? joriyKitob.muqova : null}
      />
    );
  } else if (turkum) {
    ichi = (
      <TurkumSahifa
        nomi={turkum}
        muqova={turkumMuqova(turkum)}
        kitoblar={kitoblar}
        barcha={barcha}
        och={och}
        orqaga={orqaga}
      />
    );
  } else if (tab === 'jarayon') {
    ichi = <Jarayon kitoblar={kitoblar} barcha={barcha} och={qayerdanBolsa} orqaga={function () { tabgaOt('kitoblar'); }} />;
  } else if (tab === 'kundalik') {
    ichi = <KundalikSahifa barcha={barcha} och={qayerdanBolsa} orqaga={function () { tabgaOt('kitoblar'); }} />;
  } else if (tab === 'eslatma') {
    ichi = <EslatmaSahifa barcha={barcha} och={qayerdanBolsa} orqaga={function () { tabgaOt('kitoblar'); }} />;
  } else {
    ichi = (
      <Royxat
        kitoblar={kitoblar}
        barcha={barcha}
        xato={xato}
        och={ochYakka}
        turkumMuqova={turkumMuqova}
        turkumniOch={turkumniOch}
        tab={tabgaOt}
        qayta={function () { oUrinish(urinish + 1); }}
        eslatmaSoni={eslatmaSoni}
      />
    );
  }

  return (
    <React.Fragment>
      <div className="qobiq">{ichi}</div>
      <PastNav faol={joriy ? 'kitoblar' : tab} tanla={tabgaOt} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('ildiz')).render(<Ilova />);
</script>
