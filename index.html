<style>
  :root {
    --fon-1: #0f0a1e;
    --fon-2: #1a1033;
    --oltin: #d4af37;
    --oltin-xira: rgba(212, 175, 55, .18);
    --matn: #e8e4f0;
    --matn-xira: #a79ec2;
    --karta: rgba(255, 255, 255, .045);
    --chegara: rgba(255, 255, 255, .09);
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--fon-1);
  }

  body {
    font-family: var(--sans);
    color: var(--matn);
    font-size: 16px;
    line-height: 1.6;
    background: linear-gradient(170deg, #0f0a1e 0%, #1a1033 55%, #14092a 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  /* Yulduzchalar — faqat CSS, rasmsiz */
  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    background-image:
      radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,255,255,.75), transparent),
      radial-gradient(1.2px 1.2px at 78% 9%,  rgba(255,255,255,.55), transparent),
      radial-gradient(1.6px 1.6px at 34% 62%, rgba(212,175,55,.55), transparent),
      radial-gradient(1.1px 1.1px at 88% 47%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.3px 1.3px at 57% 84%, rgba(255,255,255,.45), transparent),
      radial-gradient(1.5px 1.5px at 21% 92%, rgba(212,175,55,.4), transparent),
      radial-gradient(1.1px 1.1px at 66% 33%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.2px 1.2px at 5% 55%,  rgba(255,255,255,.35), transparent);
    opacity: .8;
  }
  body::after {
    background:
      radial-gradient(90% 55% at 50% -8%, rgba(120, 80, 190, .28), transparent 70%),
      radial-gradient(60% 40% at 90% 100%, rgba(212, 175, 55, .07), transparent 70%);

  #ildiz { position: relative; z-index: 1; }

  .qobiq {

    margin: 0 auto;

  h1, h2, h3, h4 { font-family: var(--serif); font-weight: 700; margin: 0; line-height: 1.25; }

  .bosh { text-align: center; padding: 18px 0 26px; }
  .bosh .belgi { font-size: 26px; letter-spacing: .3em; color: var(--oltin); opacity: .85; }
  .bosh h1 {
    font-size: 30px;
    margin: 8px 0 6px;

    color: transparent;

  .bosh p { margin: 0; color: var(--matn-xira); font-size: 14px; }
  .ajratgich {
    width: 120px; height: 1px; margin: 16px auto 0;
    background: linear-gradient(90deg, transparent, var(--oltin), transparent);
    opacity: .6;
  }

  /* ---------- Kitob kartalari ---------- */
  .kartalar { display: flex; flex-direction: column; gap: 14px; }

  .kitob-karta {
    display: flex;
    gap: 14px;
    align-items: center;
    padding: 12px;
    border: 1px solid var(--chegara);
    border-radius: 16px;

    text-align: left;

  .kitob-matn .muallif { font-size: 13px; color: var(--oltin); opacity: .85; }
  .kitob-matn .tavsif {

  /* ---------- Kitob sahifasi ---------- */
  .orqaga {

  .orqaga:hover { border-color: var(--oltin-xira); color: var(--oltin); }

  .kitob-bosh { text-align: center; margin-bottom: 22px; }
  .kitob-bosh h2 { font-size: 25px; margin-bottom: 6px; }
  .kitob-bosh .muallif { color: var(--oltin); font-size: 14px; }
  .kirish {
    margin: 18px 0 0;
    padding: 14px 16px;
    border-left: 2px solid var(--oltin);
    background: rgba(212,175,55,.05);
    border-radius: 0 12px 12px 0;

  /* ---------- Akkordeon ---------- */
  .bolim {

  .bolim-tugma {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 15px 16px; background: none; border: 0; color: inherit;

  .raqam {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;

  ul.magiz li::before {

  .mashq-savol { font-size: 15px; margin-bottom: 12px; }

  textarea {

  .holat { font-size: 12px; color: var(--matn-xira); margin-top: 7px; min-height: 16px; }

  .band {

  .band + .band { border-top: 1px solid rgba(255,255,255,.05); }
  .quti {

  .progress-chiziq {

  input[type=range] {

    text-align: center; font-family: var(--serif); font-size: 30px; color: var(--oltin);

  .yorliqlar { display: flex; justify-content: space-between; font-size: 12px; color: var(--matn-xira); }

  .taymer-orin { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .halqa { position: relative; width: 132px; height: 132px; }
  .halqa svg { transform: rotate(-90deg); display: block; }
  .halqa circle { fill: none; stroke-width: 5; stroke-linecap: round; }

  .halqa .yoy { stroke: var(--oltin); transition: stroke-dashoffset 1s linear; }
  .halqa .vaqt {
    position: absolute; inset: 0; display: grid; place-items: center;

  .tugmalar { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; }
  .tug {
    background: rgba(212,175,55,.1); border: 1px solid var(--oltin-xira);
    color: var(--oltin); border-radius: 999px; padding: 8px 18px;

  .tug:active { transform: scale(.95); }
  .tug.asosiy { background: var(--oltin); color: #1a1033; border-color: var(--oltin); font-weight: 600; }
  .tug.jim { background: none; color: var(--matn-xira); border-color: var(--chegara); }
  .tug:disabled { opacity: .4; cursor: default; transform: none; }

  .variant {
    display: block; width: 100%; text-align: left;
    background: rgba(0,0,0,.25); border: 1px solid var(--chegara);
    color: var(--matn); border-radius: 11px; padding: 11px 13px;

  .variant.tanlangan { border-color: var(--oltin); background: rgba(212,175,55,.1); color: var(--oltin); }
  .variant .harf {
    display: inline-grid; place-items: center; width: 21px; height: 21px;
    border-radius: 50%; border: 1px solid var(--oltin-xira);
    font-size: 12px; margin-right: 9px; color: var(--oltin); vertical-align: -4px;
  }

  /* --- Tush kundaligi --- */
  input[type=text], input[type=time] {
    background: rgba(0,0,0,.28); color: var(--matn);
    border: 1px solid var(--chegara); border-radius: 10px;
    padding: 10px 12px; font-family: var(--sans); font-size: 14.5px;

  }
  input[type=text]:focus, input[type=time]:focus { outline: none; border-color: var(--oltin); }
  input[type=text]::placeholder { color: rgba(167,158,194,.5); }
  input[type=text] { width: 100%; margin-top: 8px; }
  input[type=time] { color-scheme: dark; }

  .yozuv {
    border: 1px solid var(--chegara); border-radius: 11px;
    background: rgba(0,0,0,.22); margin-bottom: 8px; overflow: hidden;
  }
  .yozuv-bosh {
    display: flex; align-items: center; gap: 9px; width: 100%;
    background: none; border: 0; color: var(--matn); font: inherit;
    padding: 10px 12px; cursor: pointer; text-align: left;
  }
  .yozuv-sana { color: var(--oltin); font-size: 13px; flex: 0 0 auto; }
  .yozuv-qisqa {
    flex: 1; min-width: 0; font-size: 13.5px; color: var(--matn-xira);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .yozuv-strelka { flex: 0 0 auto; color: var(--oltin); opacity: .6; font-size: 10px; }
  .yozuv-tan { padding: 0 12px 12px; font-size: 14.5px; white-space: pre-wrap; animation: ochil .28s ease; }
  .nishonlar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .nishon {
    font-size: 11.5px; color: var(--oltin); background: rgba(212,175,55,.09);
    border: 1px solid var(--oltin-xira); border-radius: 999px; padding: 3px 9px;

  .nishon b { font-weight: 600; opacity: .7; margin-left: 4px; }

  /* --- Eslatma --- */
  .qatorlar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .vaqt-nishon {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--oltin-xira); background: rgba(212,175,55,.09);
    color: var(--oltin); border-radius: 999px; padding: 5px 8px 5px 12px;
    font-size: 14px; font-variant-numeric: tabular-nums;
  }
  .vaqt-nishon.ochiq-holat { opacity: .4; }
  .vaqt-nishon button {
    background: none; border: 0; color: inherit; cursor: pointer;
    font-size: 15px; line-height: 1; padding: 0 2px; opacity: .65;
  }
  .vaqt-nishon button:hover { opacity: 1; }
  .kalit-tugma {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: 0; color: var(--matn); font: inherit;
    cursor: pointer; padding: 0; margin-bottom: 12px; text-align: left;

  .kalit-yugurt {
    flex: 0 0 auto; width: 42px; height: 24px; border-radius: 999px;
    background: rgba(255,255,255,.1); border: 1px solid var(--chegara);
    position: relative; transition: background .2s, border-color .2s;

  .kalit-yugurt::after {

  .kalit-tugma.yoniq .kalit-yugurt { background: rgba(212,175,55,.25); border-color: var(--oltin); }
  .kalit-tugma.yoniq .kalit-yugurt::after { transform: translateX(18px); background: var(--oltin); }

  .izoh {
    margin-top: 4px; padding: 12px 14px; font-size: 14.5px;
    border-left: 2px solid var(--oltin); border-radius: 0 10px 10px 0;
    background: rgba(212,175,55,.06); color: var(--matn-xira);

  .xabar { text-align: center; color: var(--matn-xira); padding: 48px 20px; font-size: 15px; }
  .xabar .belgi { font-size: 34px; color: var(--oltin); opacity: .55; display: block; margin-bottom: 12px; }

  .aylana {

  .izohcha { text-align: center; font-size: 12px; color: rgba(167,158,194,.6); margin-top: 30px; }

  @media (max-width: 400px) {
    .qobiq { padding: 16px 12px 34px; }

    .bolim-tugma { padding: 13px 13px; gap: 10px; }

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ==================== Telegram WebApp (xavfsiz o'ram) ==================== */
/* SDK bo'lmasa ham (oddiy brauzer) hech qanday xato bermaydi */

const TG = (function () {
  try {
    return window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  } catch (e) { return null; }
})();

function tgTayyor() {
  if (!TG) return;
  try {
    TG.ready();
    TG.expand();
    if (TG.setHeaderColor) TG.setHeaderColor('#0f0a1e');
    if (TG.setBackgroundColor) TG.setBackgroundColor('#0f0a1e');
    if (TG.enableClosingConfirmation) TG.enableClosingConfirmation();
  } catch (e) {}
}

function haptic(tur) {
  if (!TG || !TG.HapticFeedback) return;
  try {
    if (tur === 'success' || tur === 'warning' || tur === 'error') {
      TG.HapticFeedback.notificationOccurred(tur);
    } else if (tur === 'select') {
      TG.HapticFeedback.selectionChanged();
    } else {
      TG.HapticFeedback.impactOccurred(tur || 'light');
    }
  } catch (e) {}
}

/* BackButton — kitob ichida ko'rsatiladi */
function backButton(korsat, ishlov) {
  if (!TG || !TG.BackButton) return function () {};
  try {
    if (!korsat) { TG.BackButton.hide(); return function () {}; }
    TG.BackButton.onClick(ishlov);
    TG.BackButton.show();
    return function () {
      try { TG.BackButton.offClick(ishlov); TG.BackButton.hide(); } catch (e) {}
    };
  } catch (e) { return function () {}; }
}

/* ==================== localStorage yordamchilari ==================== */

function kalit(kitobId, bolimIdx, mashqIdx) {
  return 'km_' + kitobId + '_' + bolimIdx + '_' + mashqIdx;
}

function oqi(k, standart) {
  try {
    const xom = window.localStorage.getItem(k);
    if (xom === null) return standart;
    return JSON.parse(xom);
  } catch (e) { return standart; }
}

function yoz(k, qiymat) {
  try { window.localStorage.setItem(k, JSON.stringify(qiymat)); return true; }
  catch (e) { return false; }
}

/* Saqlangan qiymatni komponent ichida boshqarish uchun umumiy hook */
function useSaqlash(k, standart) {
  const [qiymat, oQiymat] = useState(function () { return oqi(k, standart); });
  const [saqlandi, oSaqlandi] = useState(false);
  const soat = useRef(null);

  const yangila = useCallback(function (yangi) {
    oQiymat(yangi);
    yoz(k, yangi);
    oSaqlandi(true);
    if (soat.current) clearTimeout(soat.current);
    soat.current = setTimeout(function () { oSaqlandi(false); }, 1600);
  }, [k]);

  useEffect(function () {
    return function () { if (soat.current) clearTimeout(soat.current); };
  }, []);

  return [qiymat, yangila, saqlandi];
}

/* ==================== Mashqlar ==================== */

/* --- Jurnal: textarea + avtosaqlash --- */
function Jurnal(props) {
  const [matn, yangila, saqlandi] = useSaqlash(props.k, '');
  return (
    <div className="mashq">
      <span className="mashq-turi">✍️ Jurnal</span>
      <div className="mashq-savol">{props.m.savol}</div>
      <textarea
        value={matn}
        placeholder="Bu yerga yozing…"
        onChange={function (e) { yangila(e.target.value); }}
      />
      <div className={'holat' + (saqlandi ? ' saqlandi' : '')}>
        {saqlandi ? '✓ Saqlandi' : (matn ? matn.trim().split(/\s+/).filter(Boolean).length + ' so‘z' : 'Yozganingiz shu qurilmada saqlanadi')}
      </div>
    </div>
  );
}

/* --- Checklist: belgilar + progress --- */
function Checklist(props) {
  const bandlar = props.m.bandlar || [];
  const [belgilar, yangila] = useSaqlash(props.k, []);
  const xavfsiz = Array.isArray(belgilar) ? belgilar : [];

  function almashtir(i) {
    haptic('select');
    const yangi = xavfsiz.indexOf(i) === -1
      ? xavfsiz.concat([i])
      : xavfsiz.filter(function (x) { return x !== i; });
    yangila(yangi);
    if (yangi.length === bandlar.length && bandlar.length > 0) haptic('success');
  }

  const foiz = bandlar.length ? Math.round(xavfsiz.length / bandlar.length * 100) : 0;

  return (
    <div className="mashq">
      <span className="mashq-turi">☑️ Ro'yxat</span>
      {props.m.sarlavha ? <div className="mashq-savol">{props.m.sarlavha}</div> : null}
      <div>
        {bandlar.map(function (band, i) {
          const bor = xavfsiz.indexOf(i) !== -1;
          return (
            <div
              key={i}
              className={'band' + (bor ? ' belgili' : '')}
              role="checkbox"
              aria-checked={bor}
              tabIndex={0}
              onClick={function () { almashtir(i); }}
              onKeyDown={function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); almashtir(i); } }}
            >
              <span className="quti">{bor ? '✓' : ''}</span>
              <span className="yorliq">{band}</span>
            </div>
          );
        })}
      </div>
      <div className="progress-chiziq"><i style={{ width: foiz + '%' }} /></div>
      <div className="holat">{xavfsiz.length} / {bandlar.length} bajarildi — {foiz}%</div>
    </div>
  );
}

/* --- Slider: qiymat + "O'tgan safar" --- */
function Slider(props) {
  const min = typeof props.m.min === 'number' ? props.m.min : 1;
  const max = typeof props.m.max === 'number' ? props.m.max : 10;
  const oldingi = useRef(oqi(props.k, null));
  const [qiymat, yangila, saqlandi] = useSaqlash(
    props.k,
    oldingi.current === null ? Math.round((min + max) / 2) : oldingi.current
  );

  return (
    <div className="mashq">
      <span className="mashq-turi">🎚 Baholash</span>
      <div className="mashq-savol">{props.m.savol}</div>
      <div className="slider-qiymat">{qiymat}</div>
      <input
        type="range"
        min={min}
        max={max}
        step={1}
        value={qiymat}
        onChange={function (e) { yangila(Number(e.target.value)); }}
        onMouseUp={function () { haptic('light'); }}
        onTouchEnd={function () { haptic('light'); }}
      />
      <div className="yorliqlar">
        <span>{props.m.min_yorliq || min}</span>
        <span>{props.m.max_yorliq || max}</span>
      </div>
      <div className={'holat' + (saqlandi ? ' saqlandi' : '')}>
        {oldingi.current !== null
          ? 'O‘tgan safar: ' + oldingi.current
          : (saqlandi ? '✓ Saqlandi' : 'Qiymat avtomatik saqlanadi')}
      </div>
    </div>
  );
}

/* --- Taymer: aylana progress + boshlash/pauza/qayta --- */
function Taymer(props) {
  const jami = Math.max(1, Math.round((props.m.daqiqa || 5) * 60));
  const [qolgan, oQolgan] = useState(jami);
  const [ketmoqda, oKetmoqda] = useState(false);
  const [tugadi, oTugadi] = useState(false);

  useEffect(function () {
    if (!ketmoqda) return;
    const id = setInterval(function () {
      oQolgan(function (avvalgi) {
        if (avvalgi <= 1) {
          clearInterval(id);
          oKetmoqda(false);
          oTugadi(true);
          haptic('success');
          return 0;
        }
        return avvalgi - 1;
      });
    }, 1000);
    return function () { clearInterval(id); };
  }, [ketmoqda]);

  function boshla() {
    haptic('medium');
    if (tugadi) { oQolgan(jami); oTugadi(false); }
    oKetmoqda(!ketmoqda);
  }
  function qayta() {
    haptic('light');
    oKetmoqda(false); oTugadi(false); oQolgan(jami);
  }

  const daq = Math.floor(qolgan / 60);
  const son = qolgan % 60;
  const R = 60;
  const uzunlik = 2 * Math.PI * R;
  const ulush = qolgan / jami;

  return (
    <div className="mashq">
      <span className="mashq-turi">⏳ Taymer</span>
      {props.m.korsatma ? <div className="mashq-savol">{props.m.korsatma}</div> : null}
      <div className="taymer-orin">
        <div className="halqa">
          <svg width="132" height="132" viewBox="0 0 132 132">
            <circle className="iz" cx="66" cy="66" r={R} />
            <circle
              className="yoy" cx="66" cy="66" r={R}
              strokeDasharray={uzunlik}
              strokeDashoffset={uzunlik * (1 - ulush)}
            />
          </svg>
          <div className="vaqt">{daq}:{son < 10 ? '0' + son : son}</div>
        </div>
        <div className="tugmalar">
          <button className="tug asosiy" onClick={boshla}>
            {tugadi ? 'Qaytadan' : (ketmoqda ? 'Pauza' : (qolgan === jami ? 'Boshlash' : 'Davom ettirish'))}
          </button>
          <button className="tug jim" onClick={qayta}>Qayta</button>
        </div>
        {tugadi ? <div className="izoh" style={{ width: '100%' }}>🌙 Mashq tugadi. O'zingizni qanday his qilyapsiz?</div> : null}
      </div>
    </div>
  );
}

/* --- Sana yordamchilari --- */
const OYLAR = ['yanv', 'fev', 'mart', 'apr', 'may', 'iyun', 'iyul', 'avg', 'sent', 'okt', 'noy', 'dek'];

function ikki(n) { return n < 10 ? '0' + n : String(n); }

function sanaKalit(d) {
  return d.getFullYear() + '-' + ikki(d.getMonth() + 1) + '-' + ikki(d.getDate());
}

function sanaChirey(kalitMatn) {
  const q = String(kalitMatn || '').split('-');
  if (q.length !== 3) return kalitMatn || '';
  return Number(q[2]) + ' ' + (OYLAR[Number(q[1]) - 1] || '') ;
}

/* Ketma-ket kunlar seriyasi: bugundan (yoki kechadan) orqaga sanaladi */
function seriya(sanalar) {
  const bor = {};
  sanalar.forEach(function (s) { bor[s] = true; });
  const kun = new Date();
  if (!bor[sanaKalit(kun)]) kun.setDate(kun.getDate() - 1);
  let n = 0;
  while (bor[sanaKalit(kun)]) { n++; kun.setDate(kun.getDate() - 1); }
  return n;
}

/* --- Kundalik: sanali yozuvlar + belgilar chastotasi --- */
function Kundalik(props) {
  const [yozuvlar, yangila, saqlandi] = useSaqlash(props.k, []);
  const royxat = Array.isArray(yozuvlar) ? yozuvlar : [];
  const [matn, oMatn] = useState('');
  const [belgi, oBelgi] = useState('');
  const [ochiq, oOchiq] = useState(null);

  function qosh() {
    const tan = matn.trim();
    if (!tan) return;
    haptic('success');
    const bel = belgi.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    const hozir = new Date();
    yangila([{
      sana: sanaKalit(hozir),
      vaqt: ikki(hozir.getHours()) + ':' + ikki(hozir.getMinutes()),
      matn: tan,
      belgilar: bel
    }].concat(royxat));
    oMatn(''); oBelgi(''); oOchiq(null);
  }

  function ochir(i) {
    haptic('warning');
    yangila(royxat.filter(function (_, j) { return j !== i; }));
    oOchiq(null);
  }

  /* Takrorlanuvchi belgilar — "tush belgilari"ni shu yerdan topasiz */
  const hisob = {};
  royxat.forEach(function (y) {
    (y.belgilar || []).forEach(function (b) {
      const n = b.toLowerCase();
      hisob[n] = (hisob[n] || 0) + 1;
    });
  });
  const tez = Object.keys(hisob)
    .sort(function (a, b) { return hisob[b] - hisob[a]; })
    .slice(0, 8);

  const kunlar = seriya(royxat.map(function (y) { return y.sana; }));

  return (
    <div className="mashq">
      <span className="mashq-turi">🌙 Kundalik</span>
      {props.m.sarlavha ? <div className="mashq-savol">{props.m.sarlavha}</div> : null}
      {props.m.korsatma ? <div className="izoh" style={{ marginBottom: 12 }}>{props.m.korsatma}</div> : null}

      <textarea
        value={matn}
        placeholder={props.m.joy_matn || 'Eslaganingizni yozing — parcha bo‘lsa ham…'}
        onChange={function (e) { oMatn(e.target.value); }}
      />
      <input
        type="text"
        value={belgi}
        placeholder={props.m.belgi_matn || 'Belgilar, vergul bilan: suv, maktab, uchish'}
        onChange={function (e) { oBelgi(e.target.value); }}
      />
      <div className="tugmalar" style={{ justifyContent: 'flex-start', marginTop: 10 }}>
        <button className="tug asosiy" onClick={qosh} disabled={!matn.trim()}>Yozuvni saqlash</button>
      </div>

      {tez.length ? (
        <div style={{ marginTop: 14 }}>
          <div className="holat">Takrorlanayotgan belgilar — ehtimoliy tush belgilaringiz:</div>
          <div className="nishonlar">
            {tez.map(function (b) {
              return <span key={b} className="nishon">{b}<b>{hisob[b]}</b></span>;
            })}
          </div>
        </div>
      ) : null}

      {royxat.length ? (
        <div style={{ marginTop: 14 }}>
          {royxat.map(function (y, i) {
            return (
              <div key={i} className="yozuv">
                <button
                  className="yozuv-bosh"
                  onClick={function () { haptic('select'); oOchiq(ochiq === i ? null : i); }}
                  aria-expanded={ochiq === i}
                >
                  <span className="yozuv-sana">{sanaChirey(y.sana)}{y.vaqt ? ' · ' + y.vaqt : ''}</span>
                  <span className="yozuv-qisqa">{y.matn}</span>
                  <span className="yozuv-strelka">{ochiq === i ? '▲' : '▼'}</span>
                </button>
                {ochiq === i ? (
                  <div className="yozuv-tan">
                    {y.matn}
                    {(y.belgilar || []).length ? (
                      <div className="nishonlar">
                        {y.belgilar.map(function (b, j) { return <span key={j} className="nishon">{b}</span>; })}
                      </div>
                    ) : null}
                    <div className="tugmalar" style={{ justifyContent: 'flex-start', marginTop: 10 }}>
                      <button className="tug jim" onClick={function () { ochir(i); }}>O'chirish</button>
                    </div>
                  </div>
                ) : null}
              </div>
            );
          })}
        </div>
      ) : null}

      <div className={'holat' + (saqlandi ? ' saqlandi' : '')}>
        {saqlandi
          ? '✓ Saqlandi'
          : (royxat.length
              ? royxat.length + ' ta yozuv' + (kunlar > 1 ? ' · ketma-ket ' + kunlar + ' kun' : '')
              : 'Hali yozuv yo‘q. Eng qisqa parcha ham hisoblanadi.')}
      </div>
    </div>
  );
}

/* --- Eslatma: bildirishnoma + kalendarga eksport --- */
function bildirishnomaHolati() {
  try {
    if (typeof window.Notification === 'undefined') return 'yoq';
    return window.Notification.permission;
  } catch (e) { return 'yoq'; }
}

function Eslatma(props) {
  const standart = {
    yoniq: false,
    vaqtlar: Array.isArray(props.m.vaqtlar) && props.m.vaqtlar.length
      ? props.m.vaqtlar
      : ['09:00', '13:00', '17:00', '21:00']
  };
  const [holat, yangila] = useSaqlash(props.k, standart);
  const h = (holat && typeof holat === 'object') ? holat : standart;
  const vaqtlar = Array.isArray(h.vaqtlar) ? h.vaqtlar : standart.vaqtlar;

  const [ruxsat, oRuxsat] = useState(bildirishnomaHolati);
  const [yangi, oYangi] = useState('12:00');
  const [xabar, oXabar] = useState(null);
  const oxirgi = useRef('');

  const sarlavha = props.m.sarlavha || 'Eslatma';
  const matn = props.m.matn || 'Reallik tekshiruvi vaqti keldi.';

  /* Ilova ochiq turganda vaqtni kuzatib boradi */
  useEffect(function () {
    if (!h.yoniq || !vaqtlar.length) return;
    function tekshir() {
      const d = new Date();
      const hozir = ikki(d.getHours()) + ':' + ikki(d.getMinutes());
      if (vaqtlar.indexOf(hozir) === -1) return;
      const belgi = sanaKalit(d) + ' ' + hozir;
      if (oxirgi.current === belgi) return;
      oxirgi.current = belgi;
      haptic('warning');
      oXabar(matn);
      try {
        if (typeof window.Notification !== 'undefined' && window.Notification.permission === 'granted') {
          new window.Notification(sarlavha, { body: matn });
        }
      } catch (e) { /* bildirishnoma yo'q bo'lsa ham ilova ishlayveradi */ }
    }
    tekshir();
    const id = setInterval(tekshir, 15000);
    return function () { clearInterval(id); };
  }, [h.yoniq, vaqtlar.join(','), sarlavha, matn]);

  function almashtir() {
    haptic('medium');
    const keyingi = !h.yoniq;
    yangila({ yoniq: keyingi, vaqtlar: vaqtlar });
    if (keyingi) soraRuxsat();
    else oXabar(null);
  }

  function soraRuxsat() {
    try {
      if (typeof window.Notification === 'undefined') return;
      if (window.Notification.permission === 'default') {
        window.Notification.requestPermission().then(function (r) { oRuxsat(r); });
      } else {
        oRuxsat(window.Notification.permission);
      }
    } catch (e) { oRuxsat('yoq'); }
  }

  function vaqtQosh() {
    if (!yangi || vaqtlar.indexOf(yangi) !== -1) return;
    haptic('select');
    const r = vaqtlar.concat([yangi]).sort();
    yangila({ yoniq: h.yoniq, vaqtlar: r });
  }

  function vaqtOchir(v) {
    haptic('light');
    yangila({ yoniq: h.yoniq, vaqtlar: vaqtlar.filter(function (x) { return x !== v; }) });
  }

  /* Telefon kalendariga har kuni takrorlanuvchi eslatma sifatida yuklab olish */
  function kalendarga() {
    haptic('medium');
    const d = new Date();
    const bugun = String(d.getFullYear()) + ikki(d.getMonth() + 1) + ikki(d.getDate());
    const qismlar = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Kitob Magzi//UZ//', 'CALSCALE:GREGORIAN'
    ];
    vaqtlar.forEach(function (v, i) {
      const soat = v.replace(':', '') + '00';
      qismlar.push(
        'BEGIN:VEVENT',
        'UID:' + props.k + '-' + i + '-' + bugun + '@kitob-magzi',
        'DTSTAMP:' + bugun + 'T000000Z',
        'DTSTART:' + bugun + 'T' + soat,
        'DURATION:PT5M',
        'RRULE:FREQ=DAILY',
        'SUMMARY:' + sarlavha,
        'DESCRIPTION:' + matn.replace(/\n/g, ' '),
        'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY',
        'DESCRIPTION:' + sarlavha, 'END:VALARM',
        'END:VEVENT'
      );
    });
    qismlar.push('END:VCALENDAR');
    try {
      const blob = new Blob([qismlar.join('\r\n')], { type: 'text/calendar' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'eslatma.ics';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    } catch (e) {
      oXabar('Bu yerda faylni yuklab bo‘lmadi. Ilovani brauzerda oching yoki vaqtlarni telefon eslatmasiga qo‘lda kiriting.');
    }
  }

  /* Keyingi eslatmagacha qancha qolgani */
  function keyingiVaqt() {
    if (!vaqtlar.length) return null;
    const d = new Date();
    const hozir = d.getHours() * 60 + d.getMinutes();
    let eng = null;
    vaqtlar.forEach(function (v) {
      const q = v.split(':');
      let daq = Number(q[0]) * 60 + Number(q[1]) - hozir;
      if (daq <= 0) daq += 24 * 60;
      if (eng === null || daq < eng) eng = daq;
    });
    if (eng === null) return null;
    const s = Math.floor(eng / 60);
    return s ? s + ' soat ' + (eng % 60) + ' daqiqa' : eng + ' daqiqa';
  }

  const qoldi = h.yoniq ? keyingiVaqt() : null;

  return (
    <div className="mashq">
      <span className="mashq-turi">🔔 Eslatma</span>
      <div className="mashq-savol">{sarlavha}</div>
      {props.m.korsatma ? <div className="izoh" style={{ marginBottom: 12 }}>{props.m.korsatma}</div> : null}

      <button className={'kalit-tugma' + (h.yoniq ? ' yoniq' : '')} onClick={almashtir} aria-pressed={h.yoniq}>
        <span className="kalit-yugurt" />
        <span>{h.yoniq ? 'Eslatma yoqilgan' : 'Eslatmani yoqish'}</span>
      </button>

      <div className="qatorlar">
        {vaqtlar.map(function (v) {
          return (
            <span key={v} className={'vaqt-nishon' + (h.yoniq ? '' : ' ochiq-holat')}>
              {v}
              <button onClick={function () { vaqtOchir(v); }} aria-label={v + ' ni o‘chirish'}>×</button>
            </span>
          );
        })}
      </div>

      <div className="qatorlar" style={{ marginTop: 10 }}>
        <input type="time" value={yangi} onChange={function (e) { oYangi(e.target.value); }} />
        <button className="tug" onClick={vaqtQosh}>Vaqt qo'shish</button>
        <button className="tug jim" onClick={kalendarga}>Kalendarga qo'shish</button>
      </div>

      {ruxsat === 'denied' && h.yoniq ? (
        <div className="holat">Bildirishnomaga ruxsat berilmagan — eslatma ilova ichida ko‘rinadi.</div>
      ) : null}
      {ruxsat === 'default' && h.yoniq ? (
        <div className="tugmalar" style={{ justifyContent: 'flex-start', marginTop: 10 }}>
          <button className="tug" onClick={soraRuxsat}>Bildirishnomaga ruxsat berish</button>
        </div>
      ) : null}

      {xabar ? <div className="izoh" style={{ marginTop: 12 }}>🔔 {xabar}</div> : null}

      <div className="holat">
        {h.yoniq
          ? (qoldi ? 'Keyingi eslatma ' + qoldi + 'dan keyin' : 'Vaqt qo‘shing')
          : 'Vaqtlar shu qurilmada saqlanadi'}
      </div>
      <div className="holat">
        Bildirishnoma ilova ochiq turganda ishlaydi. Kun bo‘yi eslatib turishi uchun
        «Kalendarga qo‘shish» tugmasi orqali telefon kalendariga o‘tkazing.
      </div>
    </div>
  );
}

/* --- Mashq turini tanlovchi --- */
function Mashq(props) {
  const m = props.m;
  const k = kalit(props.kitobId, props.bolimIdx, props.mashqIdx);
  if (m.turi === 'jurnal') return <Jurnal m={m} k={k} />;
  if (m.turi === 'checklist') return <Checklist m={m} k={k} />;
  if (m.turi === 'slider') return <Slider m={m} k={k} />;
  if (m.turi === 'taymer') return <Taymer m={m} k={k} />;
  if (m.turi === 'test') return <Test m={m} k={k} />;
  if (m.turi === 'kundalik') return <Kundalik m={m} k={k} />;
  if (m.turi === 'eslatma') return <Eslatma m={m} k={k} />;
  return null;
}

/* ==================== Bo'lim (akkordeon) ==================== */

  return (

        <span className="raqam">{props.idx + 1}</span>

        <span className="strelka">▼</span>
      </button>

      {props.ochiq ? (
        <div className="bolim-ich">
          {magiz.length ? (
            <div className="qism">
              <div className="qism-sarlavha">💠 Mag'iz</div>
              <ul className="magiz">
                {magiz.map(function (t, i) { return <li key={i}>{t}</li>; })}
              </ul>
            </div>
          ) : null}

          {tavsiyalar.length ? (
            <div className="qism">
              <div className="qism-sarlavha">🔑 Amaliy tavsiyalar</div>
              <ol className="tavsiyalar">
                {tavsiyalar.map(function (t, i) { return <li key={i}>{t}</li>; })}
              </ol>
            </div>
          ) : null}

          {mashqlar.length ? (
            <div className="qism">
              <div className="qism-sarlavha">🌙 Mashqlar</div>
              {mashqlar.map(function (m, i) {
                return (
                  <Mashq
                    key={i}
                    m={m}
                    kitobId={props.kitobId}
                    bolimIdx={props.idx}
                    mashqIdx={i}
                  />
                );
              })}
            </div>
          ) : null}
        </div>
      ) : null}
    </section>
  );
}

/* ==================== Kitob sahifasi ==================== */

function KitobSahifa(props) {
  const [kitob, oKitob] = useState(null);
  const [xato, oXato] = useState(null);
  const [ochiq, oOchiq] = useState(0);

  useEffect(function () {
    let bekor = false;
    oKitob(null); oXato(null);
    fetch('books/' + props.id + '.json', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) { if (!bekor) oKitob(d); })
      .catch(function (e) { if (!bekor) oXato(String(e.message || e)); });
    return function () { bekor = true; };
  }, [props.id]);

  useEffect(function () { window.scrollTo(0, 0); }, [props.id]);

  if (xato) {
    return (
      <div>
        <button className="orqaga" onClick={props.orqaga}>← Ortga</button>
        <div className="xabar">
          <span className="belgi">☾</span>
          Kitobni yuklab bo'lmadi.<br /><small>{xato}</small>
        </div>
      </div>
    );
  }

  if (!kitob) {
    return (
      <div>
        <button className="orqaga" onClick={props.orqaga}>← Ortga</button>
        <div className="yuklanmoqda"><div className="aylana"></div></div>
      </div>
    );
  }

  const bolimlar = kitob.bolimlar || [];

  return (
    <div>
      <button className="orqaga" onClick={props.orqaga}>← Ortga</button>

      <div className="kitob-bosh">
        <h2>{kitob.nomi}</h2>
        <div className="muallif">{kitob.muallif}</div>
        <div className="ajratgich"></div>
        {kitob.kirish ? <p className="kirish">{kitob.kirish}</p> : null}
      </div>

      {bolimlar.map(function (b, i) {
        return (
          <Bolim
            key={i}
            b={b}
            idx={i}
            kitobId={kitob.id || props.id}
            ochiq={ochiq === i}
            almashtir={function () {
              haptic('light');
              oOchiq(ochiq === i ? -1 : i);
            }}
          />
        );
      })}

      <div className="izohcha">Javoblaringiz faqat shu qurilmada saqlanadi.</div>
    </div>
  );
}

/* ==================== Kitoblar ro'yxati ==================== */

function Royxat(props) {
  return (
    <div>
      <header className="bosh">
        <div className="belgi">☾ ✦ ☾</div>
        <h1>Kitob Mag'zi</h1>
        <p>Psixologiya va o'z-o'zini anglash kitoblarining mag'zi</p>
        <div className="ajratgich"></div>
      </header>

      {props.xato ? (
        <div className="xabar">
          <span className="belgi">☾</span>
          Kitoblar ro'yxatini yuklab bo'lmadi.<br />
          <small>{props.xato}</small>
        </div>
      ) : !props.kitoblar ? (
        <div className="yuklanmoqda"><div className="aylana"></div></div>
      ) : props.kitoblar.length === 0 ? (
        <div className="xabar"><span className="belgi">☾</span>Hozircha kitob qo'shilmagan.</div>
      ) : (
        <div className="kartalar">
          {props.kitoblar.map(function (k) {
            const rang = k.rang || '#6b4c9a';
            return (
              <button
                key={k.id}
                className="kitob-karta"
                onClick={function () { props.och(k.id); }}
              >
                <div
                  className="muqova"
                  style={{ background: 'linear-gradient(150deg, ' + rang + ', ' + rang + '55 60%, #0f0a1e)' }}
                >
                  <span>✦</span>
                </div>
                <div className="kitob-matn">
                  <h3>{k.nomi}</h3>
                  <div className="muallif">{k.muallif}</div>
                  {k.tavsif ? <div className="tavsif">{k.tavsif}</div> : null}
                </div>
              </button>
            );
          })}
        </div>
      )}

      <div className="izohcha">Har bir kitob — bir kechalik suhbat</div>
    </div>
  );
}

/* ==================== Ilova ==================== */

function Ilova() {
  const [kitoblar, oKitoblar] = useState(null);
  const [xato, oXato] = useState(null);
  const [joriy, oJoriy] = useState(null);

  useEffect(function () { tgTayyor(); }, []);

  useEffect(function () {
    fetch('books/index.json', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) { oKitoblar((d && d.kitoblar) || []); })
      .catch(function (e) { oXato(String(e.message || e)); });
  }, []);

  const orqaga = useCallback(function () {
    haptic('light');
    oJoriy(null);
  }, []);

  /* Telegram BackButton — faqat kitob ichida */
  useEffect(function () {
    return backButton(Boolean(joriy), orqaga);
  }, [joriy, orqaga]);

  /* Brauzer "orqaga" tugmasi ham ishlasin */
  useEffect(function () {
    function popstate() { oJoriy(null); }
    if (joriy) {
      window.history.pushState({ kitob: joriy }, '');
      window.addEventListener('popstate', popstate);
      return function () { window.removeEventListener('popstate', popstate); };
    }
  }, [joriy]);

  return (
    <div className="qobiq">
      {joriy
        ? <KitobSahifa id={joriy} orqaga={orqaga} />
        : <Royxat
            kitoblar={kitoblar}
            xato={xato}
            och={function (id) { haptic('medium'); oJoriy(id); }}
          />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('ildiz')).render(<Ilova />);
</script>
